<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="t d">
  <title id="t">Bouquet-Struktur auf Enigma2: Satellit und IPTV in einer Senderliste</title>
  <desc id="d">Links die Dateien im Ordner /etc/enigma2: Die Datei bouquets.tv verweist auf mehrere Bouquet-Dateien, etwa userbouquet.favourites.tv mit Satellitensendern sowie userbouquet.iptv_nachrichten.tv und userbouquet.iptv_sport.tv mit IPTV-Sendern. Darunter ein vereinfachter Auszug aus einer IPTV-Bouquet-Datei mit NAME-, SERVICE- und DESCRIPTION-Zeile. Rechts die Bouquet-Übersicht am Fernseher mit Favoriten (Sat), IPTV Nachrichten und IPTV Sport sowie der Hinweis, vor jeder Änderung ein Backup anzulegen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1629"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="820" fill="url(#bg)"/>
  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <!-- file tree -->
    <rect x="30" y="30" width="640" height="760" rx="24" fill="#111829" stroke="#334155" stroke-width="2"/>
    <text x="62" y="78" font-size="20" font-weight="700" letter-spacing="1.4" fill="#a78bfa">DATEIEN AUF DEM RECEIVER</text>
    <text x="62" y="118" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="22" fill="#94a3b8">/etc/enigma2/</text>

    <g font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="19">
      <rect x="62" y="140" width="250" height="48" rx="10" fill="#0a0f1c" stroke="#a78bfa" stroke-width="2"/>
      <text x="80" y="171" fill="#f8fafc">bouquets.tv</text>
      <path d="M96 188V420M96 236H120M96 312H120M96 388H120" fill="none" stroke="#475569" stroke-width="2.5"/>

      <rect x="120" y="212" width="400" height="48" rx="10" fill="#0a0f1c" stroke="#334155" stroke-width="2"/>
      <text x="138" y="243" fill="#e2e8f0">userbouquet.favourites.tv</text>
      <rect x="120" y="288" width="400" height="48" rx="10" fill="#0a0f1c" stroke="#334155" stroke-width="2"/>
      <text x="138" y="319" fill="#e2e8f0">userbouquet.iptv_nachrichten.tv</text>
      <rect x="120" y="364" width="400" height="48" rx="10" fill="#0a0f1c" stroke="#334155" stroke-width="2"/>
      <text x="138" y="395" fill="#e2e8f0">userbouquet.iptv_sport.tv</text>
    </g>
    <g font-size="15" font-weight="800">
      <rect x="538" y="222" width="62" height="28" rx="14" fill="#3a2a08"/><text x="569" y="241" text-anchor="middle" fill="#fcd34d">SAT</text>
      <rect x="538" y="298" width="62" height="28" rx="14" fill="#06303a"/><text x="569" y="317" text-anchor="middle" fill="#67e8f9">IPTV</text>
      <rect x="538" y="374" width="62" height="28" rx="14" fill="#06303a"/><text x="569" y="393" text-anchor="middle" fill="#67e8f9">IPTV</text>
    </g>

    <text x="62" y="476" font-size="20" font-weight="700" letter-spacing="1.4" fill="#a78bfa">AUSZUG IPTV-BOUQUET (VEREINFACHT)</text>
    <rect x="62" y="494" width="576" height="198" rx="12" fill="#0a0f1c" stroke="#334155" stroke-width="2"/>
    <g font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="18">
      <text x="80" y="532" fill="#94a3b8">#NAME IPTV Nachrichten</text>
      <text x="80" y="574" fill="#cbd5e1">#SERVICE 4097:0:1:0:0:0:0:0:0:0:</text>
      <text x="80" y="602" fill="#67e8f9">http%3a//anbieter.example/…:Sender A</text>
      <text x="80" y="636" fill="#cbd5e1">#DESCRIPTION Sender A</text>
      <text x="80" y="670" fill="#475569">…</text>
    </g>
    <text x="62" y="734" font-size="19" fill="#94a3b8">4097 = Standard-Player des Images; Doppelpunkte</text>
    <text x="62" y="762" font-size="19" fill="#94a3b8">in der Adresse werden als %3a geschrieben</text>

    <!-- TV list -->
    <rect x="700" y="30" width="470" height="520" rx="24" fill="#0d1730" stroke="#22d3ee" stroke-opacity="0.45" stroke-width="2"/>
    <text x="732" y="78" font-size="20" font-weight="700" letter-spacing="1.4" fill="#67e8f9">AM FERNSEHER: BOUQUETS</text>
    <g>
      <rect x="732" y="104" width="406" height="72" rx="14" fill="#111a30"/>
      <rect x="752" y="126" width="28" height="28" rx="8" fill="#3a2a08"/>
      <text x="798" y="147" font-size="23" font-weight="700" fill="#f8fafc">Favoriten (Sat)</text>
      <text x="1118" y="147" text-anchor="end" font-size="19" fill="#94a3b8">48</text>

      <rect x="732" y="190" width="406" height="72" rx="14" fill="#0f2a3a" stroke="#22d3ee" stroke-width="2"/>
      <rect x="752" y="212" width="28" height="28" rx="8" fill="#06303a" stroke="#22d3ee" stroke-width="2"/>
      <text x="798" y="233" font-size="23" font-weight="700" fill="#f8fafc">IPTV Nachrichten</text>
      <text x="1118" y="233" text-anchor="end" font-size="19" fill="#67e8f9">24</text>

      <rect x="732" y="276" width="406" height="72" rx="14" fill="#111a30"/>
      <rect x="752" y="298" width="28" height="28" rx="8" fill="#06303a"/>
      <text x="798" y="319" font-size="23" font-weight="700" fill="#f8fafc">IPTV Sport</text>
      <text x="1118" y="319" text-anchor="end" font-size="19" fill="#94a3b8">31</text>

      <rect x="732" y="362" width="406" height="72" rx="14" fill="#111a30" fill-opacity="0.5" stroke="#334155" stroke-dasharray="6 6" stroke-width="2"/>
      <text x="798" y="405" font-size="21" fill="#64748b">Alle Sender (Suchlauf)</text>
    </g>
    <text x="732" y="484" font-size="19" fill="#94a3b8">Reihenfolge wie in bouquets.tv;</text>
    <text x="732" y="512" font-size="19" fill="#94a3b8">Zahlen sind Beispielwerte</text>

    <!-- backup -->
    <rect x="700" y="574" width="470" height="216" rx="24" fill="#2a1f08" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M748 618l22 38h-44z" fill="none" stroke="#fcd34d" stroke-width="4" stroke-linejoin="round"/>
    <path d="M748 632v12" stroke="#fcd34d" stroke-width="4" stroke-linecap="round"/>
    <circle cx="748" cy="650" r="2.5" fill="#fcd34d"/>
    <text x="786" y="648" font-size="25" font-weight="800" fill="#fef3c7">Vorher sichern</text>
    <text x="732" y="704" font-size="20" fill="#fde68a">Backup der Senderlisten, bevor</text>
    <text x="732" y="734" font-size="20" fill="#fde68a">ein Plugin oder Sie selbst</text>
    <text x="732" y="764" font-size="20" fill="#fde68a">Bouquets verändern</text>
  </g>
</svg>
