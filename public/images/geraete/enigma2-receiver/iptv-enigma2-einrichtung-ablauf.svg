<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
  <title id="t">Ablauf der IPTV-Einrichtung auf Enigma2</title>
  <desc id="d">Fünf Stationen in Schlangenform: 1 Zugangsdaten, also M3U-Adresse oder Xtream-Codes-Daten; 2 Playlist mit Senderliste und EPG-Adresse; 3 Plugin zur Bouquet-Erstellung oder IPTV-Plugin aus dem Feed; 4 Bouquet, das in der Senderliste erscheint; 5 Fernseher, auf dem wie bei Sat umgeschaltet wird. Hinweis: Plugin-Auswahl und Menünamen hängen von Image, Feed und Version ab.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1629"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <!-- connectors -->
    <g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)">
      <path d="M380 190H422"/>
      <path d="M770 190H812"/>
      <path d="M990 300C990 350 900 360 820 392"/>
      <path d="M625 510H583"/>
    </g>

    <!-- 1 -->
    <rect x="40" y="80" width="340" height="220" rx="22" fill="#111829" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="92" cy="134" r="28" fill="#0a0f1c" stroke="#22d3ee" stroke-width="4"/>
    <text x="92" y="144" text-anchor="middle" font-size="28" font-weight="800" fill="#67e8f9">1</text>
    <text x="136" y="144" font-size="28" font-weight="800" fill="#f8fafc">Zugangsdaten</text>
    <text x="68" y="214" font-size="21" fill="#cbd5e1">M3U-Adresse oder</text>
    <text x="68" y="246" font-size="21" fill="#cbd5e1">Xtream-Codes-Daten</text>

    <!-- 2 -->
    <rect x="430" y="80" width="340" height="220" rx="22" fill="#111829" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"/>
    <circle cx="482" cy="134" r="28" fill="#0a0f1c" stroke="#22d3ee" stroke-width="4"/>
    <text x="482" y="144" text-anchor="middle" font-size="28" font-weight="800" fill="#67e8f9">2</text>
    <text x="526" y="144" font-size="28" font-weight="800" fill="#f8fafc">Playlist</text>
    <text x="458" y="214" font-size="21" fill="#cbd5e1">Senderliste vom Anbieter,</text>
    <text x="458" y="246" font-size="21" fill="#cbd5e1">dazu die EPG-Adresse</text>

    <!-- 3 -->
    <rect x="820" y="80" width="340" height="220" rx="22" fill="#111829" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="872" cy="134" r="28" fill="#0a0f1c" stroke="#3b82f6" stroke-width="4"/>
    <text x="872" y="144" text-anchor="middle" font-size="28" font-weight="800" fill="#93c5fd">3</text>
    <text x="916" y="144" font-size="28" font-weight="800" fill="#f8fafc">Plugin</text>
    <text x="848" y="214" font-size="21" fill="#cbd5e1">Bouquet-Erstellung oder</text>
    <text x="848" y="246" font-size="21" fill="#cbd5e1">IPTV-Plugin aus dem Feed</text>

    <!-- 4 -->
    <rect x="625" y="400" width="340" height="220" rx="22" fill="#111829" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="677" cy="454" r="28" fill="#0a0f1c" stroke="#3b82f6" stroke-width="4"/>
    <text x="677" y="464" text-anchor="middle" font-size="28" font-weight="800" fill="#93c5fd">4</text>
    <text x="721" y="464" font-size="28" font-weight="800" fill="#f8fafc">Bouquet</text>
    <text x="653" y="534" font-size="21" fill="#cbd5e1">IPTV-Sender erscheinen</text>
    <text x="653" y="566" font-size="21" fill="#cbd5e1">in der Senderliste</text>

    <!-- 5 -->
    <rect x="235" y="400" width="340" height="220" rx="22" fill="#171433" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="287" cy="454" r="28" fill="#0a0f1c" stroke="#a78bfa" stroke-width="4"/>
    <path d="M275 455l9 9 16-18" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="331" y="464" font-size="28" font-weight="800" fill="#f8fafc">Fernseher</text>
    <text x="263" y="534" font-size="21" fill="#cbd5e1">Umschalten wie bei Sat,</text>
    <text x="263" y="566" font-size="21" fill="#cbd5e1">mit EPG und Favoriten</text>

    <text x="600" y="672" text-anchor="middle" font-size="19" fill="#94a3b8">Plugin-Auswahl und Menünamen hängen von Image, Feed und Version ab.</text>
  </g>
</svg>
