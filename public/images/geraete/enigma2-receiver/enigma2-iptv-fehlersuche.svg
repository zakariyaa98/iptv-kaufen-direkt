<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" role="img" aria-labelledby="t d">
  <title id="t">Fehlersuche bei IPTV auf Enigma2 in fünf Schritten</title>
  <desc id="d">Prüfreihenfolge von oben nach unten: 1 Netzwerk, ob die Verbindung stabil ist, typisches Symptom Puffern und Abbrüche; 2 Player, ob ein anderer Service-Typ hilft, typisches Symptom schwarzes Bild oder kein Ton; 3 Playlist, ob Adresse und Zugang gültig sind, typisches Symptom Sender laden nicht; 4 Bouquet, ob es in bouquets.tv eingetragen ist, typisches Symptom Bouquet fehlt; 5 EPG, ob Quelle und Zuordnung stimmen, typisches Symptom keine Programmdaten.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1629"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="780" fill="url(#bg)"/>
  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <text x="40" y="60" font-size="21" font-weight="700" letter-spacing="1.5" fill="#a78bfa">FEHLERSUCHE · IN DIESER REIHENFOLGE PRÜFEN</text>

    <g>
      <rect x="40" y="86" width="1120" height="120" rx="20" fill="#111829" stroke="#334155" stroke-width="2"/>
      <circle cx="100" cy="146" r="30" fill="#0a0f1c" stroke="#22d3ee" stroke-width="4"/>
      <text x="100" y="156" text-anchor="middle" font-size="28" font-weight="800" fill="#67e8f9">1</text>
      <text x="156" y="138" font-size="27" font-weight="800" fill="#f8fafc">Netzwerk</text>
      <text x="156" y="172" font-size="20" fill="#94a3b8">LAN statt WLAN? Läuft ein anderer Stream stabil?</text>
      <rect x="866" y="124" width="266" height="42" rx="21" fill="#2a1430" stroke="#f472b6" stroke-opacity="0.7" stroke-width="2"/>
      <text x="999" y="152" text-anchor="middle" font-size="19" font-weight="700" fill="#f9a8d4">Puffern, Abbrüche</text>
    </g>
    <g>
      <rect x="40" y="222" width="1120" height="120" rx="20" fill="#111829" stroke="#334155" stroke-width="2"/>
      <circle cx="100" cy="282" r="30" fill="#0a0f1c" stroke="#22d3ee" stroke-width="4"/>
      <text x="100" y="292" text-anchor="middle" font-size="28" font-weight="800" fill="#67e8f9">2</text>
      <text x="156" y="274" font-size="27" font-weight="800" fill="#f8fafc">Player</text>
      <text x="156" y="308" font-size="20" fill="#94a3b8">Hilft ein anderer Service-Typ oder Player?</text>
      <rect x="866" y="260" width="266" height="42" rx="21" fill="#2a1430" stroke="#f472b6" stroke-opacity="0.7" stroke-width="2"/>
      <text x="999" y="288" text-anchor="middle" font-size="19" font-weight="700" fill="#f9a8d4">Schwarzbild, kein Ton</text>
    </g>
    <g>
      <rect x="40" y="358" width="1120" height="120" rx="20" fill="#111829" stroke="#334155" stroke-width="2"/>
      <circle cx="100" cy="418" r="30" fill="#0a0f1c" stroke="#3b82f6" stroke-width="4"/>
      <text x="100" y="428" text-anchor="middle" font-size="28" font-weight="800" fill="#93c5fd">3</text>
      <text x="156" y="410" font-size="27" font-weight="800" fill="#f8fafc">Playlist und Zugang</text>
      <text x="156" y="444" font-size="20" fill="#94a3b8">Adresse korrekt? Zugang aktiv? Gegenprobe am PC</text>
      <rect x="866" y="396" width="266" height="42" rx="21" fill="#2a1430" stroke="#f472b6" stroke-opacity="0.7" stroke-width="2"/>
      <text x="999" y="424" text-anchor="middle" font-size="19" font-weight="700" fill="#f9a8d4">Sender laden nicht</text>
    </g>
    <g>
      <rect x="40" y="494" width="1120" height="120" rx="20" fill="#111829" stroke="#334155" stroke-width="2"/>
      <circle cx="100" cy="554" r="30" fill="#0a0f1c" stroke="#3b82f6" stroke-width="4"/>
      <text x="100" y="564" text-anchor="middle" font-size="28" font-weight="800" fill="#93c5fd">4</text>
      <text x="156" y="546" font-size="27" font-weight="800" fill="#f8fafc">Bouquet</text>
      <text x="156" y="580" font-size="20" fill="#94a3b8">In bouquets.tv eingetragen? Senderliste neu geladen?</text>
      <rect x="866" y="532" width="266" height="42" rx="21" fill="#2a1430" stroke="#f472b6" stroke-opacity="0.7" stroke-width="2"/>
      <text x="999" y="560" text-anchor="middle" font-size="19" font-weight="700" fill="#f9a8d4">Bouquet fehlt</text>
    </g>
    <g>
      <rect x="40" y="630" width="1120" height="120" rx="20" fill="#171433" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="2"/>
      <circle cx="100" cy="690" r="30" fill="#0a0f1c" stroke="#a78bfa" stroke-width="4"/>
      <text x="100" y="700" text-anchor="middle" font-size="28" font-weight="800" fill="#c4b5fd">5</text>
      <text x="156" y="682" font-size="27" font-weight="800" fill="#f8fafc">EPG</text>
      <text x="156" y="716" font-size="20" fill="#94a3b8">EPG-Quelle vorhanden? Sender richtig zugeordnet?</text>
      <rect x="866" y="668" width="266" height="42" rx="21" fill="#2a1430" stroke="#f472b6" stroke-opacity="0.7" stroke-width="2"/>
      <text x="999" y="696" text-anchor="middle" font-size="19" font-weight="700" fill="#f9a8d4">Keine Programmdaten</text>
    </g>
  </g>
</svg>
