      <text x="642" y="394" font-size="20" fill="#e2e8f0">oft kompakt</text>
    </g>
    <g>
      <rect x="906" y="84" width="264" height="330" rx="22" fill="#111829" stroke="#334155" stroke-width="2"/>
      <ellipse cx="1038" cy="236" rx="110" ry="10" fill="#000" fill-opacity="0.35"/>
      <rect x="938" y="168" width="200" height="60" rx="10" fill="url(#box)" stroke="#475569" stroke-width="2"/>
