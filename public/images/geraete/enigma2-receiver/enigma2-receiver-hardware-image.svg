      <rect x="1040" y="182" width="78" height="22" rx="4" fill="#04131a"/>
      <rect x="1050" y="190" width="44" height="6" rx="3" fill="#22d3ee"/>
      <circle cx="960" cy="192" r="5" fill="#334155"/><circle cx="980" cy="192" r="5" fill="#334155"/>
      <text x="934" y="296" font-size="30" font-weight="800" fill="#f8fafc">GigaBlue</text>
      <text x="934" y="336" font-size="18" fill="#94a3b8">Beispiele</text>
      <text x="934" y="366" font-size="20" fill="#e2e8f0">verschiedene Serien</text>
      <text x="934" y="394" font-size="20" fill="#e2e8f0">mit Enigma2</text>
    </g>

    <!-- layers -->
    <rect x="30" y="444" width="1140" height="100" rx="20" fill="#1b1533" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="2"/>
    <text x="62" y="488" font-size="26" font-weight="800" fill="#f8fafc">Plugins &amp; Bouquets</text>
    <text x="62" y="522" font-size="20" fill="#c4b5fd">IPTV-Plugin, Bouquet-Erstellung, EPG-Import, Senderlisten</text>

    <rect x="30" y="556" width="1140" height="120" rx="20" fill="#0b2232" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2"/>
    <text x="62" y="600" font-size="26" font-weight="800" fill="#f8fafc">Enigma2-Image (Software)</text>
    <g font-size="20" font-weight="700" fill="#e2e8f0">
      <rect x="62" y="618" width="128" height="40" rx="20" fill="#0a0f1c" stroke="#22d3ee" stroke-width="2"/><text x="126" y="645" text-anchor="middle">OpenATV</text>
      <rect x="204" y="618" width="128" height="40" rx="20" fill="#0a0f1c" stroke="#22d3ee" stroke-width="2"/><text x="268" y="645" text-anchor="middle">OpenPLi</text>
      <rect x="346" y="618" width="88" height="40" rx="20" fill="#0a0f1c" stroke="#22d3ee" stroke-width="2"/><text x="390" y="645" text-anchor="middle">VTi</text>
      <rect x="448" y="618" width="130" height="40" rx="20" fill="#0a0f1c" stroke="#22d3ee" stroke-width="2"/><text x="513" y="645" text-anchor="middle">DreamOS</text>
      <rect x="592" y="618" width="120" height="40" rx="20" fill="#0a0f1c" stroke="#334155" stroke-width="2"/><text x="652" y="645" text-anchor="middle" fill="#94a3b8">weitere</text>
    </g>
    <text x="1138" y="645" text-anchor="end" font-size="19" fill="#67e8f9">bestimmt Menüs und Plugin-Feed</text>

    <rect x="30" y="688" width="1140" height="100" rx="20" fill="#0f1a33" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2"/>
    <text x="62" y="732" font-size="26" font-weight="800" fill="#f8fafc">Receiver-Hardware</text>
    <text x="62" y="766" font-size="20" fill="#93c5fd">Prozessor, Tuner, Netzwerk, Speicher – legt fest, welche Images passen</text>
  </g>
</svg>
