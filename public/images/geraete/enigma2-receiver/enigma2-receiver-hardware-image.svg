<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="t d">
  <title id="t">Enigma2-Receiver: Hardware, Image und Plugins</title>
  <desc id="d">Oben vier neutrale Receiver-Illustrationen ohne Logos für VU+, Dreambox, Zgemma und GigaBlue mit Beispielmodellen. Darunter ein Schichtenmodell: unten die Receiver-Hardware, darauf das Enigma2-Image wie OpenATV, OpenPLi, VTi oder DreamOS, ganz oben Plugins und Bouquets für IPTV.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1629"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3550"/>
      <stop offset="1" stop-color="#141b2d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="820" fill="url(#bg)"/>
  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <text x="30" y="58" font-size="21" font-weight="700" letter-spacing="1.5" fill="#a78bfa">ENIGMA2-RECEIVER · BEISPIELE</text>

    <!-- cards -->
    <g>
      <rect x="30" y="84" width="264" height="330" rx="22" fill="#111829" stroke="#334155" stroke-width="2"/>
