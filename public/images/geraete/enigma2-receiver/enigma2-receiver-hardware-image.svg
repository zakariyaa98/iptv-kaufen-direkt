      <rect x="90" y="195" width="40" height="6" rx="3" fill="#22d3ee"/>
      <circle cx="190" cy="200" r="5" fill="#334155"/><circle cx="210" cy="200" r="5" fill="#334155"/>
      <circle cx="244" cy="200" r="4" fill="#22d3ee"/>
      <text x="58" y="296" font-size="30" font-weight="800" fill="#f8fafc">VU+</text>
      <text x="58" y="336" font-size="18" fill="#94a3b8">Beispiele</text>
      <text x="58" y="366" font-size="20" fill="#e2e8f0">Uno 4K SE, Solo2,</text>
      <text x="58" y="394" font-size="20" fill="#e2e8f0">Zero</text>
    </g>
    <g>
      <rect x="322" y="84" width="264" height="330" rx="22" fill="#111829" stroke="#334155" stroke-width="2"/>
