      <rect x="354" y="160" width="200" height="68" rx="30" fill="url(#box)" stroke="#475569" stroke-width="2"/>
      <path d="M384 194H500" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
      <circle cx="524" cy="194" r="9" fill="#04131a" stroke="#22d3ee" stroke-width="2"/>
      <text x="350" y="296" font-size="30" font-weight="800" fill="#f8fafc">Dreambox</text>
      <text x="350" y="336" font-size="18" fill="#94a3b8">Beispiele</text>
      <text x="350" y="366" font-size="20" fill="#e2e8f0">DM900, DM920,</text>
      <text x="350" y="394" font-size="20" fill="#e2e8f0">Dreambox Two</text>
    </g>
    <g>
      <rect x="614" y="84" width="264" height="330" rx="22" fill="#111829" stroke="#334155" stroke-width="2"/>
      <ellipse cx="746" cy="236" rx="70" ry="10" fill="#000" fill-opacity="0.35"/>
      <rect x="694" y="148" width="104" height="80" rx="14" fill="url(#box)" stroke="#475569" stroke-width="2"/>
      <rect x="708" y="166" width="54" height="20" rx="4" fill="#04131a"/>
      <rect x="716" y="174" width="30" height="5" rx="2.5" fill="#22d3ee"/>
      <circle cx="782" cy="176" r="4" fill="#22d3ee"/>
      <path d="M708 208H784" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
