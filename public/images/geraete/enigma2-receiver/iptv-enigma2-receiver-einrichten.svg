<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
  <title id="t">IPTV auf dem Enigma2-Receiver einrichten</title>
  <desc id="d">Illustration ohne Herstellerlogos: Fernseher mit einer Senderliste, in der Satelliten- und IPTV-Sender gemeinsam stehen, daneben Vorschau und Programminformation. Darunter ein Linux-Receiver mit Frontdisplay auf dem Lowboard, per LAN-Kabel mit dem Router verbunden, dazu eine Fernbedienung und die Stichworte Bouquet, M3U und Xtream sowie Sat plus IPTV.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1428"/>
      <stop offset="1" stop-color="#060a14"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.45" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.9" cy="0.85" r="0.45">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#94a3b8" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#151c2e"/>
    </linearGradient>
    <linearGradient id="preview" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="rx" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3550"/>
      <stop offset="1" stop-color="#141b2d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect width="1200" height="900" fill="url(#g1)"/>
  <rect width="1200" height="900" fill="url(#g2)"/>

  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <!-- TV -->
    <rect x="140" y="50" width="820" height="500" rx="18" fill="url(#frame)"/>
    <rect x="152" y="62" width="796" height="476" rx="10" fill="#0a1226"/>

    <!-- channel list panel -->
    <rect x="176" y="86" width="440" height="428" rx="14" fill="#0d1730" stroke="#1e293b" stroke-width="2"/>
    <text x="200" y="124" font-size="18" font-weight="700" letter-spacing="2" fill="#94a3b8">SENDERLISTE</text>
    <g font-size="16" font-weight="700">
      <rect x="400" y="104" width="94" height="30" rx="15" fill="#3a2a08"/><text x="447" y="125" text-anchor="middle" fill="#fcd34d">Sat</text>
      <rect x="504" y="104" width="94" height="30" rx="15" fill="#06303a"/><text x="551" y="125" text-anchor="middle" fill="#67e8f9">IPTV</text>
    </g>
    <g font-size="17" font-weight="700">
      <rect x="196" y="150" width="400" height="50" rx="10" fill="#111a30"/>
      <text x="216" y="181" fill="#64748b">1</text>
      <rect x="248" y="169" width="190" height="12" rx="6" fill="#cbd5e1" fill-opacity="0.7"/>
      <rect x="520" y="162" width="62" height="26" rx="13" fill="#3a2a08"/><text x="551" y="181" text-anchor="middle" font-size="14" fill="#fcd34d">SAT</text>

      <rect x="196" y="208" width="400" height="50" rx="10" fill="#111a30"/>
      <text x="216" y="239" fill="#64748b">2</text>
      <rect x="248" y="227" width="160" height="12" rx="6" fill="#cbd5e1" fill-opacity="0.7"/>
      <rect x="520" y="220" width="62" height="26" rx="13" fill="#3a2a08"/><text x="551" y="239" text-anchor="middle" font-size="14" fill="#fcd34d">SAT</text>

      <rect x="196" y="266" width="400" height="50" rx="10" fill="#0f2a3a" stroke="#22d3ee" stroke-width="2"/>
      <text x="216" y="297" fill="#67e8f9">3</text>
      <rect x="248" y="285" width="200" height="12" rx="6" fill="#f8fafc"/>
      <rect x="520" y="278" width="62" height="26" rx="13" fill="#22d3ee"/><text x="551" y="297" text-anchor="middle" font-size="14" fill="#03141a">IPTV</text>

      <rect x="196" y="324" width="400" height="50" rx="10" fill="#111a30"/>
      <text x="216" y="355" fill="#64748b">4</text>
      <rect x="248" y="343" width="150" height="12" rx="6" fill="#cbd5e1" fill-opacity="0.7"/>
      <rect x="520" y="336" width="62" height="26" rx="13" fill="#06303a"/><text x="551" y="355" text-anchor="middle" font-size="14" fill="#67e8f9">IPTV</text>

      <rect x="196" y="382" width="400" height="50" rx="10" fill="#111a30"/>
      <text x="216" y="413" fill="#64748b">5</text>
      <rect x="248" y="401" width="176" height="12" rx="6" fill="#cbd5e1" fill-opacity="0.7"/>
      <rect x="520" y="394" width="62" height="26" rx="13" fill="#06303a"/><text x="551" y="413" text-anchor="middle" font-size="14" fill="#67e8f9">IPTV</text>

      <rect x="196" y="440" width="400" height="50" rx="10" fill="#111a30"/>
      <text x="216" y="471" fill="#64748b">6</text>
      <rect x="248" y="459" width="136" height="12" rx="6" fill="#cbd5e1" fill-opacity="0.7"/>
      <rect x="520" y="452" width="62" height="26" rx="13" fill="#3a2a08"/><text x="551" y="471" text-anchor="middle" font-size="14" fill="#fcd34d">SAT</text>
    </g>

    <!-- preview + EPG -->
    <rect x="636" y="86" width="288" height="428" rx="14" fill="#0d1730" stroke="#1e293b" stroke-width="2"/>
    <rect x="652" y="102" width="256" height="150" rx="12" fill="url(#preview)" opacity="0.8"/>
    <path d="M766 152v50l42-25z" fill="#03141a" fill-opacity="0.7"/>
    <text x="652" y="292" font-size="15" font-weight="700" letter-spacing="1.5" fill="#94a3b8">JETZT</text>
    <rect x="652" y="304" width="220" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="652" y="328" width="256" height="6" rx="3" fill="#1e293b"/>
    <rect x="652" y="328" width="150" height="6" rx="3" fill="#22d3ee"/>
    <text x="652" y="378" font-size="15" font-weight="700" letter-spacing="1.5" fill="#94a3b8">DANACH</text>
    <rect x="652" y="390" width="180" height="12" rx="6" fill="#475569"/>
    <rect x="652" y="440" width="70" height="30" rx="15" fill="#1e293b"/>
    <text x="687" y="461" text-anchor="middle" font-size="15" font-weight="800" fill="#cbd5e1">EPG</text>

    <!-- stand -->
    <rect x="510" y="550" width="80" height="40" fill="#1e293b"/>
    <rect x="420" y="584" width="260" height="14" rx="7" fill="#273149"/>

    <!-- lowboard -->
    <rect x="80" y="660" width="1040" height="70" rx="12" fill="#151d33" stroke="#1e293b" stroke-width="2"/>
    <rect x="110" y="730" width="18" height="60" fill="#111829"/>
    <rect x="1072" y="730" width="18" height="60" fill="#111829"/>
    <path d="M0 790H1200" stroke="#1e293b" stroke-width="2"/>

    <!-- receiver -->
    <rect x="300" y="588" width="520" height="72" rx="12" fill="url(#rx)" stroke="#475569" stroke-width="2"/>
    <rect x="340" y="606" width="170" height="36" rx="6" fill="#04131a" stroke="#0e3a46" stroke-width="2"/>
    <text x="425" y="631" text-anchor="middle" font-family="Consolas, 'DejaVu Sans Mono', 'Courier New', monospace" font-size="20" font-weight="700" fill="#22d3ee">IPTV 103</text>
    <circle cx="560" cy="624" r="8" fill="#334155"/>
    <circle cx="590" cy="624" r="8" fill="#334155"/>
    <rect x="636" y="619" width="124" height="10" rx="5" fill="#0a0f1c"/>
    <circle cx="792" cy="624" r="5" fill="#22d3ee"/>

    <!-- router -->
    <rect x="900" y="618" width="170" height="42" rx="10" fill="#172036" stroke="#334155" stroke-width="2"/>
    <rect x="920" y="584" width="8" height="36" rx="4" fill="#334155"/>
    <rect x="1042" y="584" width="8" height="36" rx="4" fill="#334155"/>
    <circle cx="946" cy="639" r="5" fill="#22d3ee"/>
    <circle cx="966" cy="639" r="5" fill="#3b82f6"/>
    <circle cx="986" cy="639" r="5" fill="#22d3ee" fill-opacity="0.5"/>
    <!-- LAN -->
    <path d="M820 642C850 664 872 664 900 650" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>

    <!-- remote (lying flat) -->
    <rect x="140" y="680" width="200" height="40" rx="20" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="178" cy="700" r="12" fill="none" stroke="#64748b" stroke-width="4"/>
    <circle cx="218" cy="700" r="6" fill="#ef4444" fill-opacity="0.8"/>
    <circle cx="240" cy="700" r="6" fill="#22c55e" fill-opacity="0.8"/>
    <circle cx="262" cy="700" r="6" fill="#eab308" fill-opacity="0.8"/>
    <circle cx="284" cy="700" r="6" fill="#3b82f6" fill-opacity="0.8"/>
    <rect x="300" y="694" width="26" height="12" rx="6" fill="#334155"/>

    <!-- chips -->
    <g font-weight="700" font-size="21" fill="#f8fafc">
      <rect x="990" y="80" width="190" height="48" rx="24" fill="#111829" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2"/>
      <text x="1085" y="112" text-anchor="middle">Bouquet</text>
      <rect x="990" y="144" width="190" height="48" rx="24" fill="#111829" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="2"/>
      <text x="1085" y="176" text-anchor="middle">M3U · Xtream</text>
      <rect x="990" y="208" width="190" height="48" rx="24" fill="#111829" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="2"/>
      <text x="1085" y="240" text-anchor="middle">Sat + IPTV</text>
    </g>
  </g>
</svg>
