<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d">
  <title id="t">IPTV über WLAN oder LAN</title>
  <desc id="d">Vergleich im Heimnetz: Links ist der Smart TV per LAN-Kabel mit dem Router verbunden, rechts per WLAN durch eine Wand. Stichpunkte nennen Vor- und Nachteile beider Verbindungsarten.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1629"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#172036"/>
      <path d="M0 0V14" stroke="#334155" stroke-width="5"/>
    </pattern>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>

  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <!-- ===== LAN ===== -->
    <rect x="40" y="40" width="545" height="680" rx="26" fill="#111829" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2"/>
    <text x="72" y="98" font-size="34" font-weight="800" fill="#f8fafc">LAN-Kabel</text>
    <text x="72" y="134" font-size="22" font-weight="600" fill="#67e8f9">Kabelgebunden</text>

    <!-- router -->
    <rect x="80" y="250" width="130" height="46" rx="10" fill="#172036" stroke="#334155" stroke-width="2"/>
    <rect x="98" y="220" width="7" height="32" rx="3" fill="#334155"/>
    <rect x="186" y="220" width="7" height="32" rx="3" fill="#334155"/>
    <circle cx="112" cy="273" r="5" fill="#22d3ee"/>
    <circle cx="132" cy="273" r="5" fill="#22d3ee" fill-opacity="0.6"/>
    <text x="145" y="330" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">Router</text>
    <!-- cable -->
    <path d="M210 273H300C330 273 330 250 360 250H372" fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round"/>
    <!-- tv -->
    <rect x="372" y="180" width="180" height="112" rx="10" fill="#273149"/>
    <rect x="380" y="188" width="164" height="96" rx="6" fill="#0c2947"/>
    <path d="M454 220v32l26-16z" fill="#67e8f9"/>
    <rect x="452" y="292" width="20" height="18" fill="#1e293b"/>
    <rect x="420" y="308" width="84" height="10" rx="5" fill="#273149"/>
    <text x="462" y="350" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">Smart TV</text>

    <!-- signal quality line -->
    <text x="72" y="410" font-size="18" font-weight="700" letter-spacing="1.4" fill="#94a3b8">DATENRATE IM ZEITVERLAUF</text>
    <path d="M72 470H553" stroke="#1e293b" stroke-width="2"/>
    <path d="M72 450C140 448 200 452 260 449S400 451 553 449" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>

    <g font-size="23" fill="#cbd5e1">
      <circle cx="84" cy="532" r="7" fill="#22d3ee"/>
      <text x="104" y="540">Gleichmäßige Datenrate</text>
      <circle cx="84" cy="584" r="7" fill="#22d3ee"/>
      <text x="104" y="592">Unempfindlich gegen Funkstörungen</text>
      <circle cx="84" cy="636" r="7" fill="#64748b"/>
      <text x="104" y="644">Kabel oder Powerline-Adapter nötig</text>
    </g>

    <!-- ===== WLAN ===== -->
    <rect x="615" y="40" width="545" height="680" rx="26" fill="#111829" stroke="#3b82f6" stroke-opacity="0.55" stroke-width="2"/>
    <text x="647" y="98" font-size="34" font-weight="800" fill="#f8fafc">WLAN</text>
    <text x="647" y="134" font-size="22" font-weight="600" fill="#93c5fd">Funkverbindung</text>

    <rect x="655" y="250" width="130" height="46" rx="10" fill="#172036" stroke="#334155" stroke-width="2"/>
    <rect x="673" y="220" width="7" height="32" rx="3" fill="#334155"/>
    <rect x="761" y="220" width="7" height="32" rx="3" fill="#334155"/>
    <circle cx="687" cy="273" r="5" fill="#3b82f6"/>
    <circle cx="707" cy="273" r="5" fill="#3b82f6" fill-opacity="0.6"/>
    <text x="720" y="330" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">Router</text>
    <g fill="none" stroke="#60a5fa" stroke-linecap="round" stroke-width="5">
      <path d="M800 230a40 40 0 0 1 0 56" opacity="0.9"/>
      <path d="M816 212a66 66 0 0 1 0 92" opacity="0.6"/>
      <path d="M832 196a92 92 0 0 1 0 124" opacity="0.35"/>
    </g>
    <!-- wall -->
    <rect x="862" y="170" width="26" height="160" rx="4" fill="url(#hatch)"/>
    <text x="875" y="356" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">Wand</text>
    <g fill="none" stroke="#60a5fa" stroke-linecap="round" stroke-width="4" opacity="0.35">
      <path d="M906 236a30 30 0 0 1 0 44"/>
    </g>
    <rect x="947" y="180" width="180" height="112" rx="10" fill="#273149"/>
    <rect x="955" y="188" width="164" height="96" rx="6" fill="#13234a"/>
    <path d="M1029 220v32l26-16z" fill="#93c5fd"/>
    <rect x="1027" y="292" width="20" height="18" fill="#1e293b"/>
    <rect x="995" y="308" width="84" height="10" rx="5" fill="#273149"/>
    <text x="1037" y="350" text-anchor="middle" font-size="20" font-weight="600" fill="#94a3b8">Smart TV</text>

    <text x="647" y="410" font-size="18" font-weight="700" letter-spacing="1.4" fill="#94a3b8">DATENRATE IM ZEITVERLAUF</text>
    <path d="M647 470H1128" stroke="#1e293b" stroke-width="2"/>
    <path d="M647 452C680 436 700 470 730 446S780 430 800 462S850 470 880 440S940 428 970 458S1040 470 1070 444S1110 440 1128 452" fill="none" stroke="#60a5fa" stroke-width="5" stroke-linecap="round"/>

    <g font-size="23" fill="#cbd5e1">
      <circle cx="659" cy="532" r="7" fill="#3b82f6"/>
      <text x="679" y="540">Flexibel, ganz ohne Kabel</text>
      <circle cx="659" cy="584" r="7" fill="#64748b"/>
      <text x="679" y="592">Abstand und Wände bremsen</text>
      <circle cx="659" cy="636" r="7" fill="#3b82f6"/>
      <text x="679" y="644">5 GHz: schneller, kürzere Reichweite</text>
      <circle cx="659" cy="688" r="7" fill="#3b82f6"/>
      <text x="679" y="696">2,4 GHz: größere Reichweite</text>
    </g>
  </g>
</svg>
