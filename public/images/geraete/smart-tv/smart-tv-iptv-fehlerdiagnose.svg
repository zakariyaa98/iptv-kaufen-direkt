<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-labelledby="t d">
  <title id="t">Fehlerdiagnose bei IPTV-Wiedergabeproblemen am Smart TV</title>
  <desc id="d">Entscheidungsbaum: Ruckelt das Bild oder lädt es nicht, prüfen Sie zuerst, ob alle Sender betroffen sind. Wenn nein, liegt es meist am einzelnen Stream. Wenn ja, folgt der Test über den Smartphone-Hotspot: Läuft es dort flüssig, liegt die Ursache im Heimnetz, sonst bei App, Fernseher oder Dienst.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1629"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1200" height="880" fill="url(#bg)"/>

  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <!-- start -->
    <rect x="300" y="40" width="600" height="96" rx="48" fill="#172036" stroke="#a78bfa" stroke-width="2"/>
    <text x="600" y="82" text-anchor="middle" font-size="27" font-weight="800" fill="#f8fafc">Bild ruckelt, lädt lange</text>
    <text x="600" y="116" text-anchor="middle" font-size="27" font-weight="800" fill="#f8fafc">oder bleibt schwarz</text>

    <path d="M600 136V188" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Q1 -->
    <rect x="350" y="196" width="500" height="84" rx="18" fill="#0b2a3a" stroke="#22d3ee" stroke-width="2"/>
    <text x="600" y="248" text-anchor="middle" font-size="28" font-weight="800" fill="#f8fafc">Betrifft es alle Sender?</text>

    <!-- Q1 nein -> left -->
    <path d="M350 238H190V340" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="236" y="214" width="76" height="34" rx="17" fill="#0a0f1c" stroke="#475569" stroke-width="2"/>
    <text x="274" y="238" text-anchor="middle" font-size="19" font-weight="700" fill="#cbd5e1">Nein</text>

    <rect x="40" y="348" width="320" height="240" rx="22" fill="#111829" stroke="#334155" stroke-width="2"/>
    <text x="68" y="392" font-size="18" font-weight="700" letter-spacing="1.4" fill="#a78bfa">EINZELNER STREAM</text>
    <g font-size="22" fill="#cbd5e1">
      <text x="68" y="434">Anderen Sender testen</text>
      <text x="68" y="470">Später erneut versuchen</text>
      <text x="68" y="506">Störung beim Dienst</text>
      <text x="68" y="534">melden</text>
    </g>

    <!-- Q1 ja -> down -->
    <path d="M600 280V340" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="618" y="294" width="58" height="34" rx="17" fill="#0a0f1c" stroke="#475569" stroke-width="2"/>
    <text x="647" y="318" text-anchor="middle" font-size="19" font-weight="700" fill="#cbd5e1">Ja</text>

    <!-- Q2 -->
    <rect x="400" y="348" width="400" height="120" rx="18" fill="#0b2a3a" stroke="#22d3ee" stroke-width="2"/>
    <text x="600" y="398" text-anchor="middle" font-size="26" font-weight="800" fill="#f8fafc">Läuft es flüssig über den</text>
    <text x="600" y="434" text-anchor="middle" font-size="26" font-weight="800" fill="#f8fafc">Smartphone-Hotspot?</text>

    <!-- Q2 ja -> right-down -->
    <path d="M800 408H1010V620" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="870" y="384" width="58" height="34" rx="17" fill="#0a0f1c" stroke="#475569" stroke-width="2"/>
    <text x="899" y="408" text-anchor="middle" font-size="19" font-weight="700" fill="#cbd5e1">Ja</text>

    <!-- Q2 nein -> down -->
    <path d="M600 468V620" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="618" y="520" width="76" height="34" rx="17" fill="#0a0f1c" stroke="#475569" stroke-width="2"/>
    <text x="656" y="544" text-anchor="middle" font-size="19" font-weight="700" fill="#cbd5e1">Nein</text>

    <!-- result: App / TV -->
    <rect x="400" y="628" width="400" height="212" rx="22" fill="#111829" stroke="#3b82f6" stroke-width="2"/>
    <text x="428" y="672" font-size="18" font-weight="700" letter-spacing="0.8" fill="#93c5fd">APP, FERNSEHER ODER DIENST</text>
    <g font-size="22" fill="#cbd5e1">
      <text x="428" y="712">App-Cache leeren, neu starten</text>
      <text x="428" y="748">App neu installieren</text>
      <text x="428" y="784">TV-Software aktualisieren</text>
      <text x="428" y="820">Zugang beim Anbieter prüfen</text>
    </g>

    <!-- result: Heimnetz -->
    <rect x="830" y="628" width="330" height="212" rx="22" fill="#111829" stroke="#22d3ee" stroke-width="2"/>
    <text x="858" y="672" font-size="18" font-weight="700" letter-spacing="1.4" fill="#67e8f9">HEIMNETZ</text>
    <g font-size="22" fill="#cbd5e1">
      <text x="858" y="712">Router neu starten</text>
      <text x="858" y="748">LAN-Kabel testen</text>
      <text x="858" y="784">5-GHz-WLAN nutzen</text>
      <text x="858" y="820">Andere Geräte pausieren</text>
    </g>
  </g>
</svg>
