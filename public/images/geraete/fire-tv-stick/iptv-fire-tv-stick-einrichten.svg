<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
  <title id="t">IPTV auf dem Fire TV Stick einrichten</title>
  <desc id="d">Illustration ohne Herstellerlogos: Fernseher mit einer Programmübersicht, ein Streaming-Stick im HDMI-Anschluss in einer Detailansicht, eine Sprachfernbedienung und ein WLAN-Router.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1730"/>
      <stop offset="1" stop-color="#070b15"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.7" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.2" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#94a3b8" fill-opacity="0.08"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#151c2e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2547"/>
      <stop offset="1" stop-color="#081226"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3550"/>
      <stop offset="1" stop-color="#121a2c"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <clipPath id="lens"><circle cx="300" cy="650" r="170"/></clipPath>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#dots)"/>
  <rect width="1200" height="900" fill="url(#glowA)"/>
  <rect width="1200" height="900" fill="url(#glowB)"/>

  <!-- TV -->
  <rect x="300" y="70" width="840" height="490" rx="18" fill="url(#frame)"/>
  <rect x="312" y="82" width="816" height="466" rx="10" fill="url(#screen)"/>
  <!-- abstract programme guide -->
  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <rect x="340" y="110" width="360" height="190" rx="14" fill="url(#cyanBlue)" opacity="0.35"/>
    <circle cx="520" cy="205" r="40" fill="#0a0f1c" fill-opacity="0.6" stroke="#67e8f9" stroke-width="3"/>
    <path d="M508 186v38l32-19z" fill="#67e8f9"/>
    <rect x="724" y="118" width="210" height="14" rx="7" fill="#cbd5e1"/>
    <rect x="724" y="146" width="160" height="12" rx="6" fill="#475569"/>
    <rect x="724" y="172" width="250" height="12" rx="6" fill="#334155"/>
    <rect x="724" y="196" width="200" height="12" rx="6" fill="#334155"/>
    <rect x="724" y="250" width="120" height="40" rx="20" fill="#22d3ee"/>
    <rect x="856" y="250" width="120" height="40" rx="20" fill="none" stroke="#475569" stroke-width="2"/>
    <!-- time ruler -->
    <path d="M440 334H1100" stroke="#1e293b" stroke-width="2"/>
    <g fill="#475569"><rect x="440" y="324" width="2" height="20"/><rect x="660" y="324" width="2" height="20"/><rect x="880" y="324" width="2" height="20"/></g>
    <!-- guide rows -->
    <g>
      <rect x="340" y="356" width="84" height="40" rx="8" fill="#172036"/>
      <rect x="440" y="356" width="210" height="40" rx="8" fill="#22d3ee" fill-opacity="0.8"/>
      <rect x="658" y="356" width="260" height="40" rx="8" fill="#172036" stroke="#334155" stroke-width="2"/>
      <rect x="926" y="356" width="174" height="40" rx="8" fill="#172036" stroke="#334155" stroke-width="2"/>
      <rect x="340" y="406" width="84" height="40" rx="8" fill="#172036"/>
      <rect x="440" y="406" width="320" height="40" rx="8" fill="#172036" stroke="#334155" stroke-width="2"/>
      <rect x="768" y="406" width="332" height="40" rx="8" fill="#172036" stroke="#334155" stroke-width="2"/>
      <rect x="340" y="456" width="84" height="40" rx="8" fill="#172036"/>
      <rect x="440" y="456" width="150" height="40" rx="8" fill="#172036" stroke="#334155" stroke-width="2"/>
      <rect x="598" y="456" width="300" height="40" rx="8" fill="#3b82f6" fill-opacity="0.5"/>
      <rect x="906" y="456" width="194" height="40" rx="8" fill="#172036" stroke="#334155" stroke-width="2"/>
      <rect x="456" y="370" width="110" height="12" rx="6" fill="#03141a" fill-opacity="0.55"/>
      <rect x="674" y="370" width="90" height="12" rx="6" fill="#334155"/>
      <rect x="456" y="420" width="140" height="12" rx="6" fill="#334155"/>
      <rect x="614" y="470" width="120" height="12" rx="6" fill="#cbd5e1" fill-opacity="0.6"/>
    </g>
  </g>
  <!-- TV feet -->
  <path d="M420 560l-30 50M1020 560l30 50" stroke="#273149" stroke-width="12" stroke-linecap="round"/>

  <!-- connector from TV side to magnifier -->
  <path d="M312 470C250 480 230 500 236 492" fill="none" stroke="#22d3ee" stroke-width="3" stroke-dasharray="3 8" opacity="0.7"/>

  <!-- magnified HDMI detail -->
  <circle cx="300" cy="650" r="178" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="3"/>
  <g clip-path="url(#lens)">
    <rect x="120" y="470" width="360" height="360" fill="#0d1426"/>
    <!-- TV back panel -->
    <rect x="120" y="520" width="140" height="300" fill="#172036"/>
    <rect x="232" y="600" width="30" height="64" rx="4" fill="#0a0f1c" stroke="#475569" stroke-width="2"/>
    <rect x="232" y="700" width="30" height="64" rx="4" fill="#0a0f1c" stroke="#334155" stroke-width="2"/>
    <!-- stick in port -->
    <rect x="258" y="612" width="34" height="40" rx="4" fill="#64748b"/>
    <rect x="290" y="586" width="170" height="92" rx="22" fill="url(#stick)" stroke="#475569" stroke-width="2"/>
    <rect x="300" y="596" width="60" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
    <circle cx="430" cy="632" r="6" fill="#22d3ee"/>
    <!-- power cable -->
    <path d="M460 650C500 650 500 760 470 820" fill="none" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-weight="700">
    <rect x="152" y="772" width="110" height="40" rx="20" fill="#111829" stroke="#334155" stroke-width="2"/>
    <text x="207" y="799" text-anchor="middle" font-size="21" fill="#cbd5e1">HDMI</text>
  </g>

  <!-- router -->
  <g>
    <rect x="560" y="750" width="170" height="54" rx="12" fill="#172036" stroke="#334155" stroke-width="2"/>
    <rect x="582" y="714" width="8" height="38" rx="4" fill="#334155"/>
    <rect x="700" y="714" width="8" height="38" rx="4" fill="#334155"/>
    <circle cx="604" cy="777" r="5" fill="#22d3ee"/>
    <circle cx="624" cy="777" r="5" fill="#3b82f6"/>
    <g fill="none" stroke="#67e8f9" stroke-linecap="round" stroke-width="5">
      <path d="M614 700a44 44 0 0 1 62 0" opacity="0.9"/>
      <path d="M598 682a68 68 0 0 1 94 0" opacity="0.5"/>
    </g>
  </g>

  <!-- voice remote -->
  <g transform="rotate(18 950 740)">
    <rect x="900" y="620" width="96" height="250" rx="48" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="948" cy="662" r="10" fill="#3b82f6"/>
    <circle cx="948" cy="728" r="36" fill="none" stroke="#64748b" stroke-width="5"/>
    <circle cx="948" cy="728" r="16" fill="#334155"/>
    <circle cx="922" cy="792" r="9" fill="#475569"/>
    <circle cx="948" cy="792" r="9" fill="#475569"/>
    <circle cx="974" cy="792" r="9" fill="#475569"/>
    <circle cx="922" cy="822" r="9" fill="#334155"/>
    <circle cx="948" cy="822" r="9" fill="#334155"/>
    <circle cx="974" cy="822" r="9" fill="#334155"/>
  </g>

  <!-- label chips -->
  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-weight="700">
    <rect x="40" y="70" width="230" height="50" rx="25" fill="#111829" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="68" cy="95" r="7" fill="#22d3ee"/>
    <text x="86" y="103" font-size="23" fill="#f8fafc">Fire OS</text>
    <rect x="40" y="136" width="230" height="50" rx="25" fill="#111829" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="68" cy="161" r="7" fill="#3b82f6"/>
    <text x="86" y="169" font-size="23" fill="#f8fafc">IPTV-Player</text>
    <rect x="40" y="202" width="230" height="50" rx="25" fill="#111829" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="2"/>
    <circle cx="68" cy="227" r="7" fill="#a78bfa"/>
    <text x="86" y="235" font-size="23" fill="#f8fafc">M3U · Xtream</text>
  </g>
</svg>
