<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-labelledby="t d">
  <title id="t">Fire-TV-Stick-Modelle für IPTV im Vergleich</title>
  <desc id="d">Vier Kacheln: Fire TV Stick 4K Max der zweiten Generation und Fire TV Stick 4K der zweiten Generation mit Fire OS, bei denen Appstore-Apps und APK-Installation möglich sind; Fire TV Stick 4K der dritten Generation mit Vega OS, nur Appstore-Apps; Fire TV Stick HD, Betriebssystem je nach Modell prüfen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1629"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="stick" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#151c2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="860" fill="url(#bg)"/>

  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <!-- card 1: 4K Max 2nd gen -->
    <rect x="40" y="40" width="545" height="350" rx="26" fill="#111829" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="72" y="74" width="132" height="48" rx="16" fill="url(#stick)" stroke="#475569" stroke-width="2"/>
    <rect x="58" y="88" width="16" height="20" rx="3" fill="#64748b"/>
    <circle cx="188" cy="98" r="5" fill="#22d3ee"/>
    <text x="228" y="96" font-size="28" font-weight="800" fill="#f8fafc">Fire TV Stick 4K Max</text>
    <text x="228" y="126" font-size="21" font-weight="600" fill="#94a3b8">2. Generation</text>
    <rect x="72" y="156" width="146" height="40" rx="20" fill="#22d3ee"/>
    <text x="145" y="183" text-anchor="middle" font-size="20" font-weight="800" fill="#03141a">Fire OS</text>
    <g font-size="22" fill="#cbd5e1">
      <text x="72" y="244">Bis 4K UHD · Wi-Fi 6E · 16 GB</text>
      <text x="72" y="290">Apps aus dem Appstore</text>
      <text x="72" y="330">APK-Installation möglich</text>
    </g>
    <path d="M72 262H553" stroke="#1e293b" stroke-width="2"/>
    <path d="M520 284l10 10 18-20M520 324l10 10 18-20" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- card 2: 4K 2nd gen -->
    <rect x="615" y="40" width="545" height="350" rx="26" fill="#111829" stroke="#22d3ee" stroke-opacity="0.55" stroke-width="2"/>
    <rect x="647" y="78" width="120" height="42" rx="14" fill="url(#stick)" stroke="#475569" stroke-width="2"/>
    <rect x="633" y="89" width="16" height="20" rx="3" fill="#64748b"/>
    <circle cx="752" cy="99" r="5" fill="#22d3ee"/>
    <text x="791" y="96" font-size="28" font-weight="800" fill="#f8fafc">Fire TV Stick 4K</text>
    <text x="791" y="126" font-size="21" font-weight="600" fill="#94a3b8">2. Generation</text>
    <rect x="647" y="156" width="146" height="40" rx="20" fill="#22d3ee"/>
    <text x="720" y="183" text-anchor="middle" font-size="20" font-weight="800" fill="#03141a">Fire OS</text>
    <g font-size="22" fill="#cbd5e1">
      <text x="647" y="244">Bis 4K UHD · Wi-Fi 6 · 8 GB</text>
      <text x="647" y="290">Apps aus dem Appstore</text>
      <text x="647" y="330">APK-Installation möglich</text>
    </g>
    <path d="M647 262H1128" stroke="#1e293b" stroke-width="2"/>
    <path d="M1095 284l10 10 18-20M1095 324l10 10 18-20" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- card 3: 4K 3rd gen Vega -->
    <rect x="40" y="420" width="545" height="350" rx="26" fill="#111829" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="72" y="458" width="120" height="42" rx="14" fill="url(#stick)" stroke="#475569" stroke-width="2"/>
    <rect x="58" y="469" width="16" height="20" rx="3" fill="#64748b"/>
    <circle cx="177" cy="479" r="5" fill="#a78bfa"/>
    <text x="216" y="476" font-size="28" font-weight="800" fill="#f8fafc">Fire TV Stick 4K</text>
    <text x="216" y="506" font-size="21" font-weight="600" fill="#94a3b8">3. Generation (2026)</text>
    <rect x="72" y="536" width="160" height="40" rx="20" fill="#a78bfa"/>
    <text x="152" y="563" text-anchor="middle" font-size="20" font-weight="800" fill="#0a0f1c">Vega OS</text>
    <g font-size="22" fill="#cbd5e1">
      <text x="72" y="624">Bis 4K UHD</text>
      <text x="72" y="670">Apps aus dem Appstore</text>
      <text x="72" y="710">Keine APK-Installation</text>
    </g>
    <path d="M72 642H553" stroke="#1e293b" stroke-width="2"/>
    <path d="M520 664l10 10 18-20" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M522 694l22 22M544 694l-22 22" fill="none" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>

    <!-- card 4: HD -->
    <rect x="615" y="420" width="545" height="350" rx="26" fill="#111829" stroke="#334155" stroke-width="2"/>
    <rect x="647" y="462" width="104" height="36" rx="12" fill="url(#stick)" stroke="#475569" stroke-width="2"/>
    <rect x="633" y="470" width="16" height="20" rx="3" fill="#64748b"/>
    <circle cx="737" cy="480" r="5" fill="#3b82f6"/>
    <text x="775" y="476" font-size="28" font-weight="800" fill="#f8fafc">Fire TV Stick HD</text>
    <text x="775" y="506" font-size="21" font-weight="600" fill="#94a3b8">Full-HD-Modelle</text>
    <rect x="647" y="536" width="250" height="40" rx="20" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="772" y="563" text-anchor="middle" font-size="20" font-weight="800" fill="#93c5fd">Je nach Modell</text>
    <g font-size="22" fill="#cbd5e1">
      <text x="647" y="624">Bis Full HD (1080p)</text>
      <text x="647" y="670">Apps aus dem Appstore</text>
      <text x="647" y="710">APK nur mit Fire OS</text>
    </g>
    <path d="M647 642H1128" stroke="#1e293b" stroke-width="2"/>

    <!-- footer -->
    <text x="600" y="820" text-anchor="middle" font-size="21" fill="#94a3b8">Das Betriebssystem finden Sie meist unter Einstellungen › Mein Fire TV › Info. Stand: November 2026.</text>
  </g>
</svg>
