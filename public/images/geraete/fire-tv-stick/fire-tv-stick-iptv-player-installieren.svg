<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-labelledby="t d">
  <title id="t">IPTV-Player auf dem Fire TV Stick installieren</title>
  <desc id="d">Zwei Wege zur App: Weg A über den Amazon Appstore mit Suchen und Herunterladen. Weg B über die App Downloader, nur bei Fire OS: Downloader installieren, Entwickleroptionen aktivieren, unbekannte Apps erlauben und die APK-Datei von der Website des Entwicklers laden. Beide Wege führen zu: Player öffnen, Zugangsdaten eintragen, EPG und Favoriten einrichten.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1629"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="820" fill="url(#bg)"/>

  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <!-- Weg A -->
    <rect x="40" y="40" width="520" height="420" rx="26" fill="#111829" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="72" y="72" width="104" height="40" rx="20" fill="#22d3ee"/>
    <text x="124" y="99" text-anchor="middle" font-size="21" font-weight="800" fill="#03141a">Weg A</text>
    <text x="72" y="160" font-size="30" font-weight="800" fill="#f8fafc">Amazon Appstore</text>
    <text x="72" y="194" font-size="21" fill="#94a3b8">Alle Modelle · empfohlen</text>
    <g font-size="23" font-weight="600" fill="#e2e8f0">
      <circle cx="90" cy="252" r="16" fill="#0b2a3a" stroke="#22d3ee" stroke-width="2"/>
      <text x="90" y="260" text-anchor="middle" font-size="18" font-weight="800" fill="#67e8f9">1</text>
      <text x="122" y="260">Suche (Lupe) öffnen</text>
      <circle cx="90" cy="316" r="16" fill="#0b2a3a" stroke="#22d3ee" stroke-width="2"/>
      <text x="90" y="324" text-anchor="middle" font-size="18" font-weight="800" fill="#67e8f9">2</text>
      <text x="122" y="324">Player-Namen eingeben</text>
      <circle cx="90" cy="380" r="16" fill="#0b2a3a" stroke="#22d3ee" stroke-width="2"/>
      <text x="90" y="388" text-anchor="middle" font-size="18" font-weight="800" fill="#67e8f9">3</text>
      <text x="122" y="388">„Herunterladen“ wählen</text>
    </g>
    <path d="M90 268V300M90 332V364" stroke="#334155" stroke-width="2"/>

    <!-- Weg B -->
    <rect x="640" y="40" width="520" height="420" rx="26" fill="#111829" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="672" y="72" width="104" height="40" rx="20" fill="#a78bfa"/>
    <text x="724" y="99" text-anchor="middle" font-size="21" font-weight="800" fill="#0a0f1c">Weg B</text>
    <text x="672" y="160" font-size="30" font-weight="800" fill="#f8fafc">App „Downloader“</text>
    <text x="672" y="194" font-size="21" fill="#c4b5fd">Nur Fire OS · nicht bei Vega OS</text>
    <g font-size="23" font-weight="600" fill="#e2e8f0">
      <circle cx="690" cy="252" r="16" fill="#2a1f4a" stroke="#a78bfa" stroke-width="2"/>
      <text x="690" y="260" text-anchor="middle" font-size="18" font-weight="800" fill="#c4b5fd">1</text>
      <text x="722" y="260">Downloader installieren</text>
      <circle cx="690" cy="306" r="16" fill="#2a1f4a" stroke="#a78bfa" stroke-width="2"/>
      <text x="690" y="314" text-anchor="middle" font-size="18" font-weight="800" fill="#c4b5fd">2</text>
      <text x="722" y="314">Entwickleroptionen zeigen</text>
      <circle cx="690" cy="360" r="16" fill="#2a1f4a" stroke="#a78bfa" stroke-width="2"/>
      <text x="690" y="368" text-anchor="middle" font-size="18" font-weight="800" fill="#c4b5fd">3</text>
      <text x="722" y="368">Unbekannte Apps erlauben</text>
      <circle cx="690" cy="414" r="16" fill="#2a1f4a" stroke="#a78bfa" stroke-width="2"/>
      <text x="690" y="422" text-anchor="middle" font-size="18" font-weight="800" fill="#c4b5fd">4</text>
      <text x="722" y="422">APK vom Entwickler laden</text>
    </g>
    <path d="M690 268V290M690 322V344M690 376V398" stroke="#334155" stroke-width="2"/>

    <!-- merge -->
    <path d="M300 460V520H900V460" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M600 520V556" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- common steps -->
    <rect x="40" y="566" width="1120" height="214" rx="26" fill="#172036" stroke="#334155" stroke-width="2"/>
    <text x="72" y="612" font-size="20" font-weight="700" letter-spacing="1.5" fill="#94a3b8">DANACH IN DER PLAYER-APP</text>
    <g>
      <rect x="72" y="640" width="320" height="104" rx="18" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2"/>
      <text x="232" y="684" text-anchor="middle" font-size="26" font-weight="800" fill="#f8fafc">Player öffnen</text>
      <text x="232" y="718" text-anchor="middle" font-size="20" fill="#94a3b8">Playlist hinzufügen</text>
      <path d="M396 692H432" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="440" y="640" width="320" height="104" rx="18" fill="#0a0f1c" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="2"/>
      <text x="600" y="684" text-anchor="middle" font-size="26" font-weight="800" fill="#f8fafc">Zugangsdaten</text>
      <text x="600" y="718" text-anchor="middle" font-size="20" fill="#94a3b8">M3U oder Xtream Codes</text>
      <path d="M764 692H800" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="808" y="640" width="320" height="104" rx="18" fill="#0a0f1c" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="2"/>
      <text x="968" y="684" text-anchor="middle" font-size="26" font-weight="800" fill="#f8fafc">EPG &amp; Favoriten</text>
      <text x="968" y="718" text-anchor="middle" font-size="20" fill="#94a3b8">Senderliste ordnen</text>
    </g>
  </g>
</svg>
