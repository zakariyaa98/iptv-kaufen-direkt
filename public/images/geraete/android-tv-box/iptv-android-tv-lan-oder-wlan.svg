<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d">
  <title id="t">LAN, 5-GHz- und 2,4-GHz-WLAN: Datenrate und Puffern bei IPTV</title>
  <desc id="d">Schematisches Liniendiagramm der verfügbaren Datenrate über die Zeit: LAN bleibt gleichmäßig über der benötigten Datenrate, 5-GHz-WLAN schwankt leicht, 2,4-GHz-WLAN fällt mehrfach unter die benötigte Datenrate. An diesen Stellen leert sich der Puffer und das Bild stockt. Darunter drei Hinweise zu Kabel, Frequenzband und Router-Abstand.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1629"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0.18"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <rect x="30" y="30" width="1140" height="470" rx="24" fill="#111829" stroke="#334155" stroke-width="2"/>
    <text x="62" y="78" font-size="20" font-weight="700" letter-spacing="1.4" fill="#a78bfa">VERFÜGBARE DATENRATE IM ZEITVERLAUF (SCHEMA)</text>

    <!-- axes -->
    <path d="M100 110V440H1130" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="1130" y="474" text-anchor="end" font-size="18" fill="#94a3b8">Zeit</text>
    <!-- danger zone -->
    <rect x="102" y="300" width="1028" height="139" fill="url(#danger)"/>
    <!-- required line -->
    <path d="M100 300H1130" stroke="#f8fafc" stroke-width="2.5" stroke-dasharray="10 8" opacity="0.8"/>

    <!-- LAN -->
    <path d="M100 150C250 148 400 152 550 149S850 151 1130 149" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round"/>
    <!-- 5 GHz -->
    <path d="M100 210C160 190 210 240 270 215S380 190 440 230S560 260 620 222S720 196 790 238S900 266 960 226S1080 205 1130 222" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round"/>
    <!-- 2.4 GHz -->
    <path d="M100 270C150 240 190 330 240 320S300 230 360 262S430 360 490 340S560 240 620 268S700 370 760 352S830 250 890 276S960 360 1010 330S1090 260 1130 280" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
    <!-- buffering markers -->
    <g font-size="16" font-weight="800" fill="#f9a8d4" text-anchor="middle">
      <circle cx="245" cy="320" r="10" fill="none" stroke="#f472b6" stroke-width="3"/>
      <text x="245" y="364">Puffern</text>
      <circle cx="490" cy="340" r="10" fill="none" stroke="#f472b6" stroke-width="3"/>
      <text x="490" y="384">Puffern</text>
      <circle cx="760" cy="352" r="10" fill="none" stroke="#f472b6" stroke-width="3"/>
      <text x="760" y="396">Puffern</text>
    </g>
    <!-- legend -->
    <g font-size="20" font-weight="700">
      <rect x="160" y="470" width="28" height="8" rx="4" fill="#22d3ee"/><text x="198" y="481" fill="#e2e8f0">LAN</text>
      <rect x="290" y="470" width="28" height="8" rx="4" fill="#3b82f6"/><text x="328" y="481" fill="#e2e8f0">WLAN 5 GHz</text>
      <rect x="490" y="470" width="28" height="8" rx="4" fill="#a78bfa"/><text x="528" y="481" fill="#e2e8f0">WLAN 2,4 GHz</text>
      <path d="M710 474H740" stroke="#f8fafc" stroke-width="2.5" stroke-dasharray="7 5"/><text x="750" y="481" fill="#e2e8f0">benötigt, z. B. 4K-Stream</text>
    </g>

    <!-- tips -->
    <g>
      <rect x="30" y="530" width="366" height="200" rx="22" fill="#111829" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2"/>
      <text x="58" y="578" font-size="24" font-weight="800" fill="#f8fafc">LAN-Kabel</text>
      <text x="58" y="618" font-size="20" fill="#cbd5e1">Gleichmäßig, ideal für</text>
      <text x="58" y="646" font-size="20" fill="#cbd5e1">4K und Live-Sport</text>
      <rect x="417" y="530" width="366" height="200" rx="22" fill="#111829" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="2"/>
      <text x="445" y="578" font-size="24" font-weight="800" fill="#f8fafc">5 GHz statt 2,4 GHz</text>
      <text x="445" y="618" font-size="20" fill="#cbd5e1">Mehr Tempo, weniger</text>
      <text x="445" y="646" font-size="20" fill="#cbd5e1">Störungen, kürzere Reichweite</text>
      <rect x="804" y="530" width="366" height="200" rx="22" fill="#111829" stroke="#a78bfa" stroke-opacity="0.5" stroke-width="2"/>
      <text x="832" y="578" font-size="24" font-weight="800" fill="#f8fafc">Router-Abstand</text>
      <text x="832" y="618" font-size="20" fill="#cbd5e1">Jede Wand und jeder Meter</text>
      <text x="832" y="646" font-size="20" fill="#cbd5e1">kostet Datenrate</text>
    </g>
  </g>
</svg>
