<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t d">
  <title id="t">IPTV auf der Android TV Box einrichten</title>
  <desc id="d">Illustration ohne Herstellerlogos: Fernseher mit abstrakter App-Oberfläche in Kachelreihen, davor eine flache Android-TV-Box auf einem Lowboard, per LAN-Kabel mit dem Router verbunden, dazu eine Fernbedienung und die Stichworte Play Store, M3U und Xtream sowie 4K und LAN.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1530"/>
      <stop offset="1" stop-color="#060a14"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.5" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.15" cy="0.9" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#94a3b8" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#151c2e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101f45"/>
      <stop offset="1" stop-color="#080f22"/>
    </linearGradient>
    <linearGradient id="feature" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4663"/>
      <stop offset="1" stop-color="#1b2338"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <rect width="1200" height="900" fill="url(#g1)"/>
  <rect width="1200" height="900" fill="url(#g2)"/>

  <!-- TV -->
  <rect x="200" y="60" width="800" height="470" rx="18" fill="url(#frame)"/>
  <rect x="212" y="72" width="776" height="446" rx="10" fill="url(#screen)"/>
  <!-- feature banner -->
  <rect x="240" y="100" width="720" height="150" rx="16" fill="url(#feature)" opacity="0.55"/>
  <rect x="272" y="140" width="240" height="18" rx="9" fill="#f8fafc" fill-opacity="0.85"/>
  <rect x="272" y="172" width="170" height="12" rx="6" fill="#f8fafc" fill-opacity="0.5"/>
  <rect x="272" y="206" width="110" height="28" rx="14" fill="#0a0f1c" fill-opacity="0.6"/>
  <!-- row 1: apps -->
  <rect x="240" y="270" width="120" height="12" rx="6" fill="#64748b"/>
  <g>
    <rect x="240" y="294" width="128" height="76" rx="12" fill="#22d3ee" fill-opacity="0.85"/>
    <rect x="380" y="294" width="128" height="76" rx="12" fill="#172036" stroke="#334155" stroke-width="2"/>
    <rect x="520" y="294" width="128" height="76" rx="12" fill="#172036" stroke="#334155" stroke-width="2"/>
    <rect x="660" y="294" width="128" height="76" rx="12" fill="#172036" stroke="#334155" stroke-width="2"/>
    <rect x="800" y="294" width="160" height="76" rx="12" fill="#172036" stroke="#334155" stroke-width="2"/>
    <path d="M292 316v32l26-16z" fill="#03141a" fill-opacity="0.7"/>
  </g>
  <!-- row 2: channels -->
  <rect x="240" y="392" width="160" height="12" rx="6" fill="#64748b"/>
  <g>
    <rect x="240" y="416" width="230" height="76" rx="12" fill="#172036" stroke="#3b82f6" stroke-width="2"/>
    <rect x="482" y="416" width="230" height="76" rx="12" fill="#172036" stroke="#334155" stroke-width="2"/>
    <rect x="724" y="416" width="236" height="76" rx="12" fill="#172036" stroke="#334155" stroke-width="2"/>
    <rect x="256" y="440" width="120" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="256" y="460" width="190" height="6" rx="3" fill="#1e293b"/>
    <rect x="256" y="460" width="110" height="6" rx="3" fill="#22d3ee"/>
    <rect x="498" y="440" width="100" height="10" rx="5" fill="#475569"/>
    <rect x="740" y="440" width="130" height="10" rx="5" fill="#475569"/>
  </g>
  <!-- stand -->
  <rect x="560" y="530" width="80" height="40" fill="#1e293b"/>
  <rect x="470" y="566" width="260" height="16" rx="8" fill="#273149"/>

  <!-- lowboard -->
  <rect x="120" y="640" width="960" height="70" rx="12" fill="#151d33" stroke="#1e293b" stroke-width="2"/>
  <rect x="150" y="710" width="18" height="70" fill="#111829"/>
  <rect x="1032" y="710" width="18" height="70" fill="#111829"/>
  <path d="M0 780H1200" stroke="#1e293b" stroke-width="2"/>

  <!-- android box (isometric-ish) -->
  <g>
    <path d="M300 600l130-34 150 30-130 36z" fill="url(#boxTop)" stroke="#475569" stroke-width="2"/>
    <path d="M300 600v28l150 32v-28z" fill="#151c2e" stroke="#475569" stroke-width="2"/>
    <path d="M450 632v28l130-34v-30z" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="330" cy="618" r="4" fill="#22d3ee"/>
    <path d="M372 596l58-15" stroke="#ffffff" stroke-opacity="0.08" stroke-width="6" stroke-linecap="round"/>
  </g>
  <!-- HDMI cable box -> TV -->
  <path d="M520 606C560 590 590 580 600 570" fill="none" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

  <!-- router -->
  <g>
    <rect x="820" y="596" width="180" height="44" rx="10" fill="#172036" stroke="#334155" stroke-width="2"/>
    <rect x="842" y="562" width="8" height="36" rx="4" fill="#334155"/>
    <rect x="970" y="562" width="8" height="36" rx="4" fill="#334155"/>
    <circle cx="866" cy="618" r="5" fill="#22d3ee"/>
    <circle cx="886" cy="618" r="5" fill="#3b82f6"/>
    <circle cx="906" cy="618" r="5" fill="#22d3ee" fill-opacity="0.5"/>
  </g>
  <!-- LAN cable box -> router -->
  <path d="M580 612C680 640 760 640 820 626" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>

  <!-- remote -->
  <g transform="rotate(-62 700 676)">
    <rect x="660" y="606" width="80" height="210" rx="40" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <circle cx="700" cy="660" r="28" fill="none" stroke="#64748b" stroke-width="5"/>
    <circle cx="700" cy="660" r="12" fill="#334155"/>
    <circle cx="684" cy="716" r="8" fill="#475569"/>
    <circle cx="716" cy="716" r="8" fill="#475569"/>
    <rect x="688" y="744" width="24" height="44" rx="12" fill="#334155"/>
  </g>

  <!-- chips -->
  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" font-weight="700" font-size="21" fill="#f8fafc">
    <rect x="1020" y="80" width="160" height="48" rx="24" fill="#111829" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2"/>
    <text x="1100" y="112" text-anchor="middle">Play Store</text>
    <rect x="1020" y="144" width="160" height="48" rx="24" fill="#111829" stroke="#3b82f6" stroke-opacity="0.7" stroke-width="2"/>
    <text x="1100" y="176" text-anchor="middle">M3U · Xtream</text>
    <rect x="1020" y="208" width="160" height="48" rx="24" fill="#111829" stroke="#a78bfa" stroke-opacity="0.7" stroke-width="2"/>
    <text x="1100" y="240" text-anchor="middle">4K · LAN</text>
  </g>
</svg>
