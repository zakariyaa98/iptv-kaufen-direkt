<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="t d">
  <title id="t">IPTV auf Android TV einrichten: Ablauf in fünf Stationen</title>
  <desc id="d">Geschwungene Linie mit fünf Stationen: 1 Play Store öffnen, 2 IPTV-Player installieren, 3 Zugang wählen – M3U oder Xtream Codes, 4 EPG-Adresse hinterlegen, 5 Sender prüfen und Favoriten anlegen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1629"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.6" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>

  <path d="M110 360C200 210 310 210 380 360S560 510 600 360S760 210 820 360S1000 510 1090 360" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round" opacity="0.85"/>

  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif" text-anchor="middle">
    <!-- 1 -->
    <circle cx="110" cy="360" r="46" fill="#0a0f1c" stroke="#22d3ee" stroke-width="5"/>
    <text x="110" y="374" font-size="38" font-weight="800" fill="#67e8f9">1</text>
    <rect x="20" y="430" width="180" height="104" rx="18" fill="#111829" stroke="#334155" stroke-width="2"/>
    <text x="110" y="474" font-size="23" font-weight="800" fill="#f8fafc">Play Store</text>
    <text x="110" y="506" font-size="19" fill="#94a3b8">öffnen</text>

    <!-- 2 -->
    <circle cx="380" cy="360" r="46" fill="#0a0f1c" stroke="#22d3ee" stroke-width="5"/>
    <text x="380" y="374" font-size="38" font-weight="800" fill="#67e8f9">2</text>
    <rect x="280" y="150" width="200" height="104" rx="18" fill="#111829" stroke="#334155" stroke-width="2"/>
    <text x="380" y="194" font-size="23" font-weight="800" fill="#f8fafc">IPTV-Player</text>
    <text x="380" y="226" font-size="19" fill="#94a3b8">installieren</text>

    <!-- 3 -->
    <circle cx="600" cy="360" r="46" fill="#0a0f1c" stroke="#3b82f6" stroke-width="5"/>
    <text x="600" y="374" font-size="38" font-weight="800" fill="#93c5fd">3</text>
    <rect x="490" y="430" width="220" height="132" rx="18" fill="#111829" stroke="#334155" stroke-width="2"/>
    <text x="600" y="474" font-size="23" font-weight="800" fill="#f8fafc">Zugang wählen</text>
    <rect x="512" y="494" width="82" height="36" rx="18" fill="#0b2a3a" stroke="#22d3ee" stroke-width="2"/>
    <text x="553" y="518" font-size="17" font-weight="800" fill="#67e8f9">M3U</text>
    <rect x="604" y="494" width="88" height="36" rx="18" fill="#102a4a" stroke="#3b82f6" stroke-width="2"/>
    <text x="648" y="518" font-size="17" font-weight="800" fill="#93c5fd">Xtream</text>

    <!-- 4 -->
    <circle cx="820" cy="360" r="46" fill="#0a0f1c" stroke="#3b82f6" stroke-width="5"/>
    <text x="820" y="374" font-size="38" font-weight="800" fill="#93c5fd">4</text>
    <rect x="720" y="150" width="200" height="104" rx="18" fill="#111829" stroke="#334155" stroke-width="2"/>
    <text x="820" y="194" font-size="23" font-weight="800" fill="#f8fafc">EPG-Adresse</text>
    <text x="820" y="226" font-size="19" fill="#94a3b8">hinterlegen</text>

    <!-- 5 -->
    <circle cx="1090" cy="360" r="46" fill="#0a0f1c" stroke="#a78bfa" stroke-width="5"/>
    <path d="M1072 360l13 13 24-26" fill="none" stroke="#c4b5fd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="990" y="430" width="190" height="104" rx="18" fill="#111829" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="2"/>
    <text x="1085" y="474" font-size="23" font-weight="800" fill="#f8fafc">Sender prüfen</text>
    <text x="1085" y="506" font-size="19" fill="#94a3b8">Favoriten anlegen</text>

    <text x="600" y="640" font-size="20" fill="#94a3b8">Die Bezeichnungen der Menüpunkte unterscheiden sich je nach Player-App.</text>
  </g>
</svg>
