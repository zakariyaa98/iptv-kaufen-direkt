<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" role="img" aria-labelledby="t d">
  <title id="t">Worauf es beim Kauf einer Android TV Box für IPTV ankommt</title>
  <desc id="d">Fünf Kriterien mit Balken für Mindestwert und Empfehlung: Arbeitsspeicher mindestens 2 GB, komfortabler mit 3 bis 4 GB; interner Speicher mindestens 8 GB, besser 16 GB oder mehr; 4K mit HDMI 2.0, HDCP 2.2 und H.265-Decoder; Netzwerk mit LAN-Anschluss und 5-GHz-WLAN; Zertifizierung mit Play Protect. Alle Angaben sind Richtwerte.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1629"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg)"/>
  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <text x="40" y="66" font-size="21" font-weight="700" letter-spacing="1.5" fill="#a78bfa">KAUFKRITERIEN FÜR IPTV · RICHTWERTE</text>
    <g font-size="18" font-weight="700" fill="#94a3b8">
      <rect x="760" y="48" width="18" height="18" rx="4" fill="#475569"/>
      <text x="786" y="64">Minimum</text>
      <rect x="900" y="48" width="18" height="18" rx="4" fill="url(#bar)"/>
      <text x="926" y="64">Empfohlen</text>
    </g>

    <!-- row template: label left, bars right -->
    <!-- 1 RAM -->
    <rect x="40" y="96" width="1120" height="128" rx="20" fill="#111829" stroke="#334155" stroke-width="2"/>
    <rect x="68" y="124" width="72" height="72" rx="16" fill="#0b2a3a"/>
    <g fill="none" stroke="#67e8f9" stroke-width="4"><rect x="84" y="146" width="40" height="28" rx="3"/><path d="M92 146v-8M104 146v-8M116 146v-8M92 182v-8M104 182v-8M116 182v-8"/></g>
    <text x="164" y="154" font-size="27" font-weight="800" fill="#f8fafc">Arbeitsspeicher</text>
    <text x="164" y="186" font-size="20" fill="#94a3b8">große Listen und EPG</text>
    <rect x="560" y="132" width="250" height="22" rx="11" fill="#475569"/>
    <text x="820" y="150" font-size="20" font-weight="700" fill="#cbd5e1">2 GB</text>
    <rect x="560" y="168" width="420" height="22" rx="11" fill="url(#bar)"/>
    <text x="990" y="186" font-size="20" font-weight="700" fill="#f8fafc">3–4 GB</text>

    <!-- 2 Storage -->
    <rect x="40" y="240" width="1120" height="128" rx="20" fill="#111829" stroke="#334155" stroke-width="2"/>
    <rect x="68" y="268" width="72" height="72" rx="16" fill="#102a4a"/>
    <g fill="none" stroke="#93c5fd" stroke-width="4"><rect x="86" y="284" width="36" height="42" rx="4"/><path d="M94 296h20M94 306h20"/></g>
    <text x="164" y="298" font-size="27" font-weight="800" fill="#f8fafc">Interner Speicher</text>
    <text x="164" y="330" font-size="20" fill="#94a3b8">Apps, Logos, Cache</text>
    <rect x="560" y="276" width="220" height="22" rx="11" fill="#475569"/>
    <text x="790" y="294" font-size="20" font-weight="700" fill="#cbd5e1">8 GB</text>
    <rect x="560" y="312" width="420" height="22" rx="11" fill="url(#bar)"/>
    <text x="990" y="330" font-size="20" font-weight="700" fill="#f8fafc">16 GB +</text>

    <!-- 3 4K -->
    <rect x="40" y="384" width="1120" height="128" rx="20" fill="#111829" stroke="#334155" stroke-width="2"/>
    <rect x="68" y="412" width="72" height="72" rx="16" fill="#2a1f4a"/>
    <text x="104" y="458" text-anchor="middle" font-size="26" font-weight="800" fill="#c4b5fd">4K</text>
    <text x="164" y="442" font-size="27" font-weight="800" fill="#f8fafc">4K-Wiedergabe</text>
    <text x="164" y="474" font-size="20" fill="#94a3b8">Box, Kabel und TV müssen passen</text>
    <g font-size="20" font-weight="700" fill="#f8fafc">
      <rect x="560" y="428" width="160" height="40" rx="20" fill="#0a0f1c" stroke="#a78bfa" stroke-width="2"/>
      <text x="640" y="455" text-anchor="middle">HDMI 2.0+</text>
      <rect x="736" y="428" width="160" height="40" rx="20" fill="#0a0f1c" stroke="#a78bfa" stroke-width="2"/>
      <text x="816" y="455" text-anchor="middle">HDCP 2.2</text>
      <rect x="912" y="428" width="216" height="40" rx="20" fill="#0a0f1c" stroke="#a78bfa" stroke-width="2"/>
      <text x="1020" y="455" text-anchor="middle">H.265 (HEVC)</text>
    </g>

    <!-- 4 Network -->
    <rect x="40" y="528" width="1120" height="128" rx="20" fill="#111829" stroke="#334155" stroke-width="2"/>
    <rect x="68" y="556" width="72" height="72" rx="16" fill="#0b2a3a"/>
    <g fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"><path d="M80 590a34 34 0 0 1 48 0M90 602a20 20 0 0 1 28 0"/><circle cx="104" cy="614" r="3" fill="#67e8f9"/></g>
    <text x="164" y="586" font-size="27" font-weight="800" fill="#f8fafc">Netzwerk</text>
    <text x="164" y="618" font-size="20" fill="#94a3b8">wichtiger als der Prozessor</text>
    <g font-size="20" font-weight="700" fill="#f8fafc">
      <rect x="560" y="572" width="200" height="40" rx="20" fill="#0a0f1c" stroke="#22d3ee" stroke-width="2"/>
      <text x="660" y="599" text-anchor="middle">LAN-Anschluss</text>
      <rect x="776" y="572" width="170" height="40" rx="20" fill="#0a0f1c" stroke="#22d3ee" stroke-width="2"/>
      <text x="861" y="599" text-anchor="middle">5-GHz-WLAN</text>
      <rect x="962" y="572" width="166" height="40" rx="20" fill="#0a0f1c" stroke="#334155" stroke-width="2"/>
      <text x="1045" y="599" text-anchor="middle" fill="#cbd5e1">Wi-Fi 6 ideal</text>
    </g>

    <!-- 5 Certification -->
    <rect x="40" y="672" width="1120" height="128" rx="20" fill="#111829" stroke="#22d3ee" stroke-opacity="0.5" stroke-width="2"/>
    <rect x="68" y="700" width="72" height="72" rx="16" fill="#0b2a3a"/>
    <path d="M104 714l24 10v16c0 16-10 26-24 30-14-4-24-14-24-30v-16z" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linejoin="round"/>
    <path d="M94 740l7 7 14-15" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="164" y="730" font-size="27" font-weight="800" fill="#f8fafc">Zertifizierung</text>
    <text x="164" y="762" font-size="20" fill="#94a3b8">Play Store und Sicherheitsupdates</text>
    <rect x="560" y="716" width="340" height="40" rx="20" fill="#22d3ee"/>
    <text x="730" y="743" text-anchor="middle" font-size="20" font-weight="800" fill="#03141a">Play Protect zertifiziert</text>
  </g>
</svg>
