<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-labelledby="t d">
  <title id="t">Fehlersuche an der MAG Box: Netzwerk, Portal, Sender, EPG</title>
  <desc id="d">Vier Prüfstationen von links nach rechts: Netzwerk, ob die Box eine Verbindung hat; Portal, ob es lädt und die MAC-Adresse angenommen wird; Sender, ob alle oder nur einzelne Sender betroffen sind; EPG, ob Programmdaten fehlen. Darunter eine Legende, wo die Ursache meist liegt: am Gerät, im Heimnetz, beim Portal oder Server, beim Anbieter oder bei einem einzelnen Sender.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1629"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <text x="40" y="60" font-size="21" font-weight="700" letter-spacing="1.5" fill="#a78bfa">FEHLERSUCHE · VON LINKS NACH RECHTS</text>

    <g fill="none" stroke="#64748b" stroke-width="4" marker-end="url(#a)">
      <path d="M302 250H322"/><path d="M590 250H610"/><path d="M878 250H898"/>
    </g>

    <!-- 1 Netzwerk -->
    <rect x="40" y="90" width="260" height="380" rx="22" fill="#111829" stroke="#22d3ee" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="90" cy="140" r="26" fill="#22d3ee"/><text x="90" y="150" text-anchor="middle" font-size="26" font-weight="800" fill="#03141a">1</text>
    <text x="64" y="214" font-size="26" font-weight="800" fill="#f8fafc">Netzwerk</text>
    <text x="64" y="256" font-size="19" fill="#cbd5e1">Hat die Box eine</text>
    <text x="64" y="284" font-size="19" fill="#cbd5e1">IP-Adresse?</text>
    <text x="64" y="326" font-size="19" fill="#cbd5e1">Läuft das Internet</text>
    <text x="64" y="354" font-size="19" fill="#cbd5e1">auf anderen Geräten?</text>
    <rect x="64" y="400" width="140" height="34" rx="17" fill="#0b2232" stroke="#22d3ee" stroke-width="2"/>
    <text x="134" y="423" text-anchor="middle" font-size="16" font-weight="700" fill="#67e8f9">Heimnetz</text>

    <!-- 2 Portal -->
    <rect x="328" y="90" width="260" height="380" rx="22" fill="#111829" stroke="#34d399" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="378" cy="140" r="26" fill="#34d399"/><text x="378" y="150" text-anchor="middle" font-size="26" font-weight="800" fill="#04221a">2</text>
    <text x="352" y="214" font-size="26" font-weight="800" fill="#f8fafc">Portal</text>
    <text x="352" y="256" font-size="19" fill="#cbd5e1">Lädt das Portal?</text>
    <text x="352" y="298" font-size="19" fill="#cbd5e1">Wird die MAC</text>
    <text x="352" y="326" font-size="19" fill="#cbd5e1">angenommen?</text>
    <text x="352" y="368" font-size="19" fill="#cbd5e1">URL korrekt?</text>
    <rect x="352" y="400" width="160" height="34" rx="17" fill="#0b2a22" stroke="#34d399" stroke-width="2"/>
    <text x="432" y="423" text-anchor="middle" font-size="16" font-weight="700" fill="#6ee7b7">Portal / Anbieter</text>

    <!-- 3 Sender -->
    <rect x="616" y="90" width="260" height="380" rx="22" fill="#111829" stroke="#3b82f6" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="666" cy="140" r="26" fill="#3b82f6"/><text x="666" y="150" text-anchor="middle" font-size="26" font-weight="800" fill="#f8fafc">3</text>
    <text x="640" y="214" font-size="26" font-weight="800" fill="#f8fafc">Sender</text>
    <text x="640" y="256" font-size="19" fill="#cbd5e1">Alle schwarz oder</text>
    <text x="640" y="284" font-size="19" fill="#cbd5e1">nur einzelne?</text>
    <text x="640" y="326" font-size="19" fill="#cbd5e1">Puffern zu allen</text>
    <text x="640" y="354" font-size="19" fill="#cbd5e1">Tageszeiten?</text>
    <rect x="640" y="400" width="160" height="34" rx="17" fill="#0f1a33" stroke="#3b82f6" stroke-width="2"/>
    <text x="720" y="423" text-anchor="middle" font-size="16" font-weight="700" fill="#93c5fd">Sender / Server</text>

    <!-- 4 EPG -->
    <rect x="904" y="90" width="256" height="380" rx="22" fill="#171433" stroke="#a78bfa" stroke-opacity="0.6" stroke-width="2"/>
    <circle cx="954" cy="140" r="26" fill="#a78bfa"/><text x="954" y="150" text-anchor="middle" font-size="26" font-weight="800" fill="#1b1533">4</text>
    <text x="928" y="214" font-size="26" font-weight="800" fill="#f8fafc">EPG</text>
    <text x="928" y="256" font-size="19" fill="#cbd5e1">Fehlen Programm-</text>
    <text x="928" y="284" font-size="19" fill="#cbd5e1">daten überall oder</text>
    <text x="928" y="312" font-size="19" fill="#cbd5e1">nur bei einzelnen</text>
    <text x="928" y="340" font-size="19" fill="#cbd5e1">Sendern?</text>
    <rect x="928" y="400" width="140" height="34" rx="17" fill="#1b1533" stroke="#a78bfa" stroke-width="2"/>
    <text x="998" y="423" text-anchor="middle" font-size="16" font-weight="700" fill="#c4b5fd">Portal-Daten</text>

    <!-- legend -->
    <rect x="40" y="500" width="1120" height="230" rx="22" fill="#172036" stroke="#334155" stroke-width="2"/>
    <text x="72" y="546" font-size="20" font-weight="700" letter-spacing="1.4" fill="#a78bfa">WO LIEGT DIE URSACHE?</text>
    <g font-size="19">
      <circle cx="84" cy="590" r="8" fill="#f472b6"/><text x="102" y="597" fill="#e2e8f0" font-weight="700">Gerät:</text><text x="172" y="597" fill="#cbd5e1">langsam, hängt, Update bricht ab</text>
      <circle cx="84" cy="632" r="8" fill="#22d3ee"/><text x="102" y="639" fill="#e2e8f0" font-weight="700">Heimnetz:</text><text x="204" y="639" fill="#cbd5e1">Puffern, Abbrüche, kein Netz</text>
      <circle cx="84" cy="674" r="8" fill="#34d399"/><text x="102" y="681" fill="#e2e8f0" font-weight="700">Portal/Server:</text><text x="246" y="681" fill="#cbd5e1">Portal lädt nicht, Ladebildschirm</text>
      <circle cx="626" cy="590" r="8" fill="#fbbf24"/><text x="644" y="597" fill="#e2e8f0" font-weight="700">Anbieter:</text><text x="740" y="597" fill="#cbd5e1">MAC nicht freigeschaltet, Zugang aus</text>
      <circle cx="626" cy="632" r="8" fill="#3b82f6"/><text x="644" y="639" fill="#e2e8f0" font-weight="700">Einzelner Sender:</text><text x="818" y="639" fill="#cbd5e1">nur ein Kanal schwarz</text>
      <text x="626" y="681" fill="#94a3b8">Faustregel: erst prüfen, ob alles oder nur</text>
      <text x="626" y="709" fill="#94a3b8">ein Teil betroffen ist.</text>
    </g>
  </g>
</svg>
