<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">Catch-up, Timeshift und Aufnahme bei IPTV</title>
  <desc id="d">Programmzeitschrift über einer Zeitleiste mit Archivbereich und Live-Markierung, dazu Symbole für Pause, Zurückspulen und Aufnahme.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1730"/><stop offset="1" stop-color="#070b15"/></linearGradient>
    <radialGradient id="ga" cx="0.8" cy="0.2" r="0.6"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb" cx="0.15" cy="0.9" r="0.55"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.2"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#94a3b8" fill-opacity="0.08"/></pattern>
    <linearGradient id="arch" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.25"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0.6"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <rect width="1200" height="675" fill="url(#ga)"/>
  <rect width="1200" height="675" fill="url(#gb)"/>
  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <!-- EPG grid -->
    <rect x="80" y="80" width="1040" height="300" rx="20" fill="#111829" stroke="#1e293b" stroke-width="2"/>
    <g font-size="18" fill="#94a3b8">
      <text x="230" y="120">18:00</text><text x="450" y="120">19:00</text><text x="670" y="120">20:00</text><text x="890" y="120">21:00</text>
    </g>
    <g>
      <rect x="110" y="140" width="100" height="64" rx="10" fill="#172036"/>
      <rect x="110" y="220" width="100" height="64" rx="10" fill="#172036"/>
      <rect x="110" y="300" width="100" height="64" rx="10" fill="#172036"/>
      <circle cx="140" cy="172" r="14" fill="#a78bfa" fill-opacity="0.7"/>
      <circle cx="140" cy="252" r="14" fill="#22d3ee" fill-opacity="0.7"/>
      <circle cx="140" cy="332" r="14" fill="#64748b"/>
      <!-- archive symbol -->
      <path d="M182 162a12 12 0 1 1-4 16" stroke="#67e8f9" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M174 160l4 8 7-5" stroke="#67e8f9" stroke-width="3" fill="none"/>
      <path d="M182 242a12 12 0 1 1-4 16" stroke="#67e8f9" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M174 240l4 8 7-5" stroke="#67e8f9" stroke-width="3" fill="none"/>
    </g>
    <g>
      <rect x="225" y="140" width="210" height="64" rx="10" fill="#1e2a48"/>
      <rect x="445" y="140" width="320" height="64" rx="10" fill="#22d3ee" fill-opacity="0.22" stroke="#22d3ee" stroke-width="2"/>
      <rect x="775" y="140" width="320" height="64" rx="10" fill="#172036"/>
      <rect x="225" y="220" width="320" height="64" rx="10" fill="#1e2a48"/>
      <rect x="555" y="220" width="300" height="64" rx="10" fill="#1e2a48"/>
      <rect x="865" y="220" width="230" height="64" rx="10" fill="#172036"/>
      <rect x="225" y="300" width="430" height="64" rx="10" fill="#151c2e"/>
      <rect x="665" y="300" width="430" height="64" rx="10" fill="#151c2e"/>
    </g>
    <g font-size="18" fill="#cbd5e1">
      <text x="245" y="178">Nachrichten</text><text x="465" y="178" fill="#f8fafc" font-weight="700">▶ Replay: Dokumentation</text><text x="795" y="178">Spielfilm</text>
      <text x="245" y="258">Magazin</text><text x="575" y="258">Sport live</text><text x="885" y="258">Talk</text>
      <text x="245" y="338" fill="#64748b">kein Archiv</text>
    </g>
    <!-- now line -->
    <path d="M820 130V372" stroke="#f8fafc" stroke-width="3"/>
    <rect x="782" y="94" width="76" height="30" rx="15" fill="#ef4444"/>
    <text x="820" y="115" fill="#fff" font-size="16" font-weight="800" text-anchor="middle">LIVE</text>

    <!-- timeline -->
    <rect x="80" y="430" width="1040" height="16" rx="8" fill="#1e293b"/>
    <rect x="80" y="430" width="660" height="16" rx="8" fill="url(#arch)"/>
    <rect x="740" y="430" width="80" height="16" fill="#22d3ee"/>
    <circle cx="820" cy="438" r="14" fill="#f8fafc"/>
    <g font-size="19" fill="#94a3b8">
      <text x="80" y="480">Archiv beim Anbieter (Catch-up)</text>
      <text x="700" y="480">Puffer</text>
      <text x="1120" y="480" text-anchor="end">Zukunft</text>
    </g>

    <!-- controls -->
    <g transform="translate(80 530)">
      <circle cx="40" cy="40" r="40" fill="#172036" stroke="#334155" stroke-width="2"/>
      <path d="M48 24L24 40l24 16zM66 24L42 40l24 16z" fill="#22d3ee" transform="translate(-4 0)"/>
      <circle cx="140" cy="40" r="40" fill="#172036" stroke="#334155" stroke-width="2"/>
      <rect x="126" y="24" width="10" height="32" rx="2" fill="#22d3ee"/><rect x="144" y="24" width="10" height="32" rx="2" fill="#22d3ee"/>
      <circle cx="240" cy="40" r="40" fill="#172036" stroke="#334155" stroke-width="2"/>
      <circle cx="240" cy="40" r="16" fill="#ef4444"/>
      <text x="320" y="36" fill="#f8fafc" font-size="24" font-weight="700">Zurückspulen · Pause · Aufnahme</text>
      <text x="320" y="68" fill="#94a3b8" font-size="19">Timeshift, Restart, Catch-up und Aufnahme im Vergleich</text>
    </g>
  </g>
</svg>
