<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-labelledby="t d">
  <title id="t">IPTV: schwarzes Bild oder kein Ton</title>
  <desc id="d">Fernseher mit schwarzem Bild und Tonwelle, ein Decoder-Chip mit den Formaten H.264, H.265 und AV1 und ein Lautsprecher mit durchgestrichenem AC3-Hinweis.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f1730"/><stop offset="1" stop-color="#070b15"/></linearGradient>
    <radialGradient id="ga" cx="0.25" cy="0.2" r="0.6"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.2"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="gb" cx="0.85" cy="0.85" r="0.55"><stop offset="0" stop-color="#a78bfa" stop-opacity="0.2"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#94a3b8" fill-opacity="0.08"/></pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#151c2e"/></linearGradient>
    <linearGradient id="cb" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#dots)"/>
  <rect width="1200" height="675" fill="url(#ga)"/>
  <rect width="1200" height="675" fill="url(#gb)"/>

  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <!-- TV with black picture -->
    <rect x="70" y="110" width="560" height="340" rx="18" fill="url(#frame)"/>
    <rect x="84" y="124" width="532" height="312" rx="10" fill="#020409"/>
    <path d="M300 470h100l20 40H280z" fill="#1e293b"/>
    <rect x="240" y="508" width="220" height="12" rx="6" fill="#1e293b"/>
    <!-- player bar -->
    <rect x="114" y="384" width="472" height="6" rx="3" fill="#1e293b"/>
    <rect x="114" y="384" width="210" height="6" rx="3" fill="#22d3ee"/>
    <circle cx="324" cy="387" r="9" fill="#22d3ee"/>
    <text x="114" y="416" fill="#94a3b8" font-size="18">00:12:48</text>
    <!-- sound wave: audio works -->
    <g transform="translate(250 230)" stroke="#22d3ee" stroke-width="10" stroke-linecap="round">
      <path d="M0 40V60"/><path d="M30 20V80"/><path d="M60 0V100"/><path d="M90 25V75"/><path d="M120 10V90"/><path d="M150 35V65"/><path d="M180 20V80"/>
    </g>
    <text x="350" y="196" fill="#cbd5e1" font-size="26" font-weight="700" text-anchor="middle">Ton läuft – Bild schwarz</text>

    <!-- Decoder chip -->
    <g transform="translate(720 110)">
      <rect x="0" y="0" width="200" height="200" rx="22" fill="#111829" stroke="url(#cb)" stroke-width="4"/>
      <g stroke="#334155" stroke-width="6" stroke-linecap="round">
        <path d="M40 -18v18M80 -18v18M120 -18v18M160 -18v18M40 200v18M80 200v18M120 200v18M160 200v18M-18 40h18M-18 80h18M-18 120h18M-18 160h18M200 40h18M200 80h18M200 120h18M200 160h18"/>
      </g>
      <text x="100" y="50" fill="#a78bfa" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="2">DECODER</text>
      <text x="40" y="96" fill="#f8fafc" font-size="22" font-weight="700">H.264</text><path d="M140 88l10 10 18-20" stroke="#22d3ee" stroke-width="6" fill="none" stroke-linecap="round"/>
      <text x="40" y="136" fill="#f8fafc" font-size="22" font-weight="700">H.265</text><text x="152" y="138" fill="#a78bfa" font-size="28" font-weight="800">?</text>
      <text x="40" y="176" fill="#f8fafc" font-size="22" font-weight="700">AV1</text><text x="152" y="178" fill="#a78bfa" font-size="28" font-weight="800">?</text>
    </g>

    <!-- Speaker with muted AC3 -->
    <g transform="translate(980 120)">
      <rect x="0" y="0" width="140" height="230" rx="20" fill="#172036" stroke="#334155" stroke-width="3"/>
      <circle cx="70" cy="70" r="30" fill="#0a0f1c" stroke="#334155" stroke-width="3"/>
      <circle cx="70" cy="155" r="44" fill="#0a0f1c" stroke="#334155" stroke-width="3"/>
      <circle cx="70" cy="155" r="14" fill="#334155"/>
    </g>
    <g transform="translate(1000 380)">
      <rect x="0" y="0" width="100" height="44" rx="22" fill="none" stroke="#a78bfa" stroke-width="3"/>
      <text x="50" y="30" fill="#f8fafc" font-size="20" font-weight="700" text-anchor="middle">AC3</text>
      <path d="M-6 50L106 -6" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- arrows -->
    <path d="M640 210h60" stroke="#334155" stroke-width="4" stroke-dasharray="8 8"/>
    <path d="M940 210h28" stroke="#334155" stroke-width="4" stroke-dasharray="8 8"/>

    <!-- bottom chips -->
    <g font-size="22" font-weight="600">
      <rect x="720" y="470" width="190" height="52" rx="26" fill="none" stroke="#22d3ee" stroke-width="2"/>
      <text x="815" y="503" fill="#f8fafc" text-anchor="middle">HW ⇄ SW</text>
      <rect x="930" y="470" width="200" height="52" rx="26" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <text x="1030" y="503" fill="#f8fafc" text-anchor="middle">Passthrough</text>
    </g>
    <text x="70" y="600" fill="#94a3b8" font-size="22">Codec-Probleme erkennen: Video- und Tonformat getrennt prüfen</text>
  </g>
</svg>
