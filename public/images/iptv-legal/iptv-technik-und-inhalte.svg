<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d">
  <title id="t">IPTV-Technik und Inhalte getrennt betrachtet</title>
  <desc id="d">Oben die Ebene Technik mit App, M3U, Xtream und Receiver. Unten die Ebene Inhalte mit Sendern, Filmen und Sport, für die Rechte nötig sind.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1629"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#bg)"/>
  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <rect x="30" y="30" width="740" height="210" rx="24" fill="#111829" stroke="#22d3ee" stroke-opacity=".6" stroke-width="2.5"/>
    <text x="62" y="82" font-size="31" font-weight="800" fill="#67e8f9">Technik</text>
    <text x="738" y="82" text-anchor="end" font-size="24" fill="#cbd5e1">So kommt der Stream an</text>
    <g text-anchor="middle" font-size="26" font-weight="700" fill="#f8fafc">
      <rect x="62" y="116" width="150" height="84" rx="16" fill="#0a0f1c" stroke="#334155" stroke-width="2"/>
      <text x="137" y="167">App</text>
      <rect x="232" y="116" width="150" height="84" rx="16" fill="#0a0f1c" stroke="#334155" stroke-width="2"/>
      <text x="307" y="167">M3U</text>
      <rect x="402" y="116" width="150" height="84" rx="16" fill="#0a0f1c" stroke="#334155" stroke-width="2"/>
      <text x="477" y="167">Xtream</text>
      <rect x="572" y="116" width="166" height="84" rx="16" fill="#0a0f1c" stroke="#334155" stroke-width="2"/>
      <text x="655" y="167">Receiver</text>
    </g>

    <circle cx="400" cy="260" r="27" fill="#0a0f1c" stroke="#a78bfa" stroke-width="3"/>
    <text x="400" y="272" text-anchor="middle" font-size="34" font-weight="800" fill="#a78bfa">≠</text>

    <rect x="30" y="280" width="740" height="210" rx="24" fill="#0b2a22" stroke="#34d399" stroke-opacity=".6" stroke-width="2.5"/>
    <text x="62" y="332" font-size="31" font-weight="800" fill="#6ee7b7">Inhalte</text>
    <text x="738" y="332" text-anchor="end" font-size="24" fill="#cbd5e1">Hierfür braucht es Rechte</text>
    <g text-anchor="middle" font-size="26" font-weight="700" fill="#f8fafc">
      <rect x="62" y="366" width="210" height="84" rx="16" fill="#0a0f1c" stroke="#34d399" stroke-opacity=".5" stroke-width="2"/>
      <text x="167" y="417">Sender</text>
      <rect x="295" y="366" width="210" height="84" rx="16" fill="#0a0f1c" stroke="#34d399" stroke-opacity=".5" stroke-width="2"/>
      <text x="400" y="417">Filme</text>
      <rect x="528" y="366" width="210" height="84" rx="16" fill="#0a0f1c" stroke="#34d399" stroke-opacity=".5" stroke-width="2"/>
      <text x="633" y="417">Sport</text>
    </g>
  </g>
</svg>
