<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="t d">
  <title id="t">Warnsignale bei verdächtigen IPTV-Angeboten</title>
  <desc id="d">Eine fiktive Werbeanzeige mit tausenden Sendern, allen Sport- und Premium-Sendern und einem Kleinstpreis wird mit einer Lupe geprüft. Daneben der Hinweis, dass Impressum und Lizenzen unklar bleiben.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1629"/>
      <stop offset="1" stop-color="#080c18"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#bg)"/>
  <g font-family="Manrope, 'Segoe UI', Arial, Helvetica, sans-serif">
    <rect x="30" y="30" width="500" height="460" rx="26" fill="#111829" stroke="#fbbf24" stroke-opacity=".7" stroke-width="2.5"/>
    <text x="280" y="84" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="2" fill="#fcd34d">FIKTIVE ANZEIGE</text>

    <g font-size="30" font-weight="800" fill="#f8fafc">
      <path d="M62 128l34 60H28z" transform="translate(30 -2) scale(.72) translate(10 40)" fill="#fbbf24" fill-opacity=".2" stroke="#fbbf24" stroke-width="5" stroke-linejoin="round"/>
      <text x="124" y="160">Tausende Sender</text>
      <path d="M62 128l34 60H28z" transform="translate(30 88) scale(.72) translate(10 40)" fill="#fbbf24" fill-opacity=".2" stroke="#fbbf24" stroke-width="5" stroke-linejoin="round"/>
      <text x="124" y="250">Alle Sportsender</text>
      <path d="M62 128l34 60H28z" transform="translate(30 178) scale(.72) translate(10 40)" fill="#fbbf24" fill-opacity=".2" stroke="#fbbf24" stroke-width="5" stroke-linejoin="round"/>
      <text x="124" y="340">Alle Premium-Sender</text>
    </g>

    <rect x="62" y="384" width="436" height="74" rx="18" fill="#2b1f0a" stroke="#fbbf24" stroke-width="2.5"/>
    <text x="280" y="432" text-anchor="middle" font-size="30" font-weight="800" fill="#fcd34d">Kleinstpreis</text>

    <circle cx="660" cy="150" r="82" fill="#0a0f1c" fill-opacity=".8" stroke="#22d3ee" stroke-width="10"/>
    <path d="M618 210L566 276" stroke="#22d3ee" stroke-width="18" stroke-linecap="round"/>
    <text x="660" y="176" text-anchor="middle" font-size="76" font-weight="800" fill="#67e8f9">?</text>

    <g text-anchor="middle">
      <rect x="552" y="310" width="218" height="82" rx="18" fill="#111829" stroke="#334155" stroke-width="2"/>
      <text x="661" y="362" font-size="26" font-weight="700" fill="#f8fafc">Impressum?</text>
      <rect x="552" y="408" width="218" height="82" rx="18" fill="#111829" stroke="#334155" stroke-width="2"/>
      <text x="661" y="460" font-size="26" font-weight="700" fill="#f8fafc">Lizenzen?</text>
    </g>
  </g>
</svg>
